<header class="h-16 w-full bg-surface-container-lowest flex items-center justify-between gap-3 px-4 sm:px-6 lg:px-8 z-40 shadow-sm border-b border-outline-variant/10">
  <div class="flex items-center gap-3 flex-1 min-w-0">
    <button id="mobileSidebarToggle" type="button" class="md:hidden inline-flex h-10 w-10 items-center justify-center rounded-full bg-surface-container-low border border-outline-variant/30 text-on-surface-variant shrink-0">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <div class="flex items-center bg-surface-container-low px-4 py-1 rounded-full w-full border border-outline-variant/30 max-w-[320px] sm:max-w-[400px] min-w-0">
      <span class="material-symbols-outlined text-outline shrink-0">search</span>
      <input id="topbarSearch" class="bg-transparent border-none focus:ring-0 text-body-sm font-body-sm w-full placeholder:text-outline-variant outline-none min-w-0" placeholder="Search data, metrics, assets..." type="text">
    </div>
  </div>
  <div class="flex items-center gap-3 sm:gap-6 shrink-0">
    <div class="relative">
      <button id="notificationBell" class="relative text-on-surface-variant hover:bg-secondary-container p-2 rounded-full transition-colors focus:outline-none">
        <span class="material-symbols-outlined">notifications</span>
        <span id="notificationBadge" class="hidden absolute top-1 right-1 w-2 h-2 bg-error rounded-full"></span>
      </button>
      <div id="notificationDropdown" class="hidden absolute right-0 top-[115%] w-80 bg-white rounded-xl shadow-lg border border-outline-variant/20 z-50 overflow-hidden text-left">
        <div class="p-4 border-b border-outline-variant/10 flex items-center justify-between">
          <h3 class="text-label-lg font-bold text-on-surface">Notifications</h3>
          <span id="notificationUnreadCount" class="hidden bg-primary text-white text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="notificationList" class="max-h-96 overflow-y-auto">
          <div class="p-6 text-center text-on-surface-variant text-body-sm">
            No notifications yet
          </div>
        </div>
        <div class="p-3 text-center border-t border-outline-variant/10">
          <a id="viewAllNotificationsLink" href="Notifications.html" class="text-primary text-label-md font-bold hover:underline">View all notifications</a>
        </div>
      </div>
    </div>
    <div class="relative">
      <button id="userProfileBtn" class="flex items-center gap-3 pl-3 pr-2 py-1 rounded-full bg-surface-container-low border border-outline-variant/20 hover:bg-surface-container-high transition-colors focus:outline-none">
        <div class="text-right flex flex-col">
          <span id="topbarUserName" class="text-label-lg font-bold text-on-surface leading-tight">User</span>
          <span id="topbarUserRole" class="text-[10px] text-on-surface-variant font-medium uppercase tracking-wider">Role</span>
        </div>
        <div id="topbarUserAvatar" class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant/30 bg-primary-fixed flex items-center justify-center font-bold text-primary text-xs">
          U
        </div>
        <span class="material-symbols-outlined text-on-surface-variant text-sm">keyboard_arrow_down</span>
      </button>
      <div id="userProfileDropdown" class="hidden absolute right-0 top-[115%] w-48 bg-white border border-outline-variant/30 rounded-xl shadow-lg py-2 z-[100] text-left">
        <a href="MyProfile.html" class="flex items-center gap-3 px-4 py-2 text-on-surface hover:bg-surface-container-low transition-colors">
          <span class="material-symbols-outlined text-on-surface-variant text-[20px]">person</span>
          <span class="text-label-lg font-medium">My Profile</span>
        </a>
        <div class="border-t border-outline-variant/10 my-1"></div>
        <button id="logoutBtn" class="w-full flex items-center gap-3 px-4 py-2 text-error hover:bg-error/10 transition-colors text-left">
          <span class="material-symbols-outlined text-[20px]">logout</span>
          <span class="text-label-lg font-medium">Log Out</span>
        </button>
      </div>
    </div>
  </div>
</header>
<div id="sidebarBackdrop" class="fixed inset-0 bg-black/40 z-30 hidden md:hidden"></div>
