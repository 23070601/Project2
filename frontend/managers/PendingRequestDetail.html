<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Detail - VNU-IS Asset Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/theme.config.js"></script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .bg-brand-blue { background-color: #005BAC; }
  .text-brand-blue { color: #005BAC; }
</style>
</head>
<body class="bg-surface text-on-surface overflow-x-hidden min-h-screen flex flex-col">

<div id="sidebar-placeholder"></div>

<div class="ml-[240px] flex flex-col min-h-screen">
  <div id="topbar-placeholder"></div>

  <main class="flex-1 mt-[20px] mb-[40px] p-8 max-w-6xl mx-auto w-full">
    <a id="backLink" href="PendingRequest.html" class="inline-flex items-center gap-2 px-4 py-2 bg-white text-brand-blue font-bold rounded-xl border border-outline-variant/30 shadow-xs hover:bg-brand-blue hover:text-white hover:border-brand-blue transition-all duration-200 text-body-sm mb-6 group">
      <span class="material-symbols-outlined text-lg transition-transform group-hover:-translate-x-1">arrow_back</span>
      <span>Back to Requests</span>
    </a>
    <div id="content" class="space-y-6"></div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/ui-helpers.js"></script>
<script>
  Auth.guard('Manager');
  Layout.init({ role: 'Manager', activePage: 'PendingRequest' });
  
  const reportId = new URLSearchParams(location.search).get('id');
  const rawIdStr = String(reportId || '10').trim();
  const cleanId = rawIdStr.replace(/^(#|FR-|REP-)+/gi, '');
  const numericId = cleanId.replace(/^0+/, '') || cleanId;

  const DEMO_REPORTS = {
    '10': { report_id: '10', reporter_name: 'Nguyen Van A', asset_name: 'Panasonic 4K Projector PT-VMZ51', asset_type: 'Projector / Display', room_name: 'R102', room_id: 'R102', priority: 'High', status: 'Pending Approval', description: 'Panasonic Projector power light turns amber and powers down.', reported_at: '2026-07-29 08:00:00' },
    '2': { report_id: '2', reporter_name: 'Tran Thi B', asset_name: 'Daikin Inverter AC 18000 BTU', asset_type: 'Air Conditioner', room_name: 'R401', room_id: 'R401', priority: 'Medium', status: 'Pending Approval', description: 'Air conditioner is running but blowing warm air into the classroom.', reported_at: '2026-07-28 14:00:00' },
    '7': { report_id: '7', reporter_name: 'Nguyen Van A', asset_name: 'Daikin Inverter AC 18000 BTU', asset_type: 'Air Conditioner', room_name: 'R201', room_id: 'R201', priority: 'Medium', status: 'Pending Approval', description: 'Air conditioner leaking water heavily onto student desks.', reported_at: '2026-07-29 07:00:00' },
    '4': { 
      report_id: '4', 
      reporter_name: 'Tran Thi B', 
      asset_name: 'JBL Wall Mount Speaker System', 
      asset_type: 'Audio System', 
      room_name: 'R401', 
      room_id: 'R401', 
      priority: 'Low', 
      status: 'Rejected', 
      description: 'Speaker system makes static noise when microphone is turned on.', 
      reported_at: '2026-07-26 23:30:00'
    }
  };

  const DEMO_SUGGESTIONS = [
    { technicianId: 3, fullName: 'Le Van C', specialty: 'Projector / Display', specialtyMatch: true, activeWorkload: 1 },
    { technicianId: 4, fullName: 'Pham Thi D', specialty: 'Audio / TV / Switch', specialtyMatch: false, activeWorkload: 2 },
    { technicianId: 6, fullName: 'Vu Van F', specialty: 'Microphone / Electronics', specialtyMatch: false, activeWorkload: 0 }
  ];

  function resolveReporterName(report) {
    if (!report) return 'Anonymous';
    return report.reporter_name || report.reporter_full_name || report.full_name || report.user_name ||
      (report.reporter_email ? report.reporter_email.replace(/@.*/, '') : '') ||
      (report.reporter_id === 1 ? 'Nguyen Van A' :
       report.reporter_id === 2 ? 'Tran Thi B' :
       report.reporter_id === 3 ? 'Le Van C' :
       report.reporter_id === 4 ? 'Pham Thi D' :
       report.reporter_id === 5 ? 'Hoang Van E' :
       report.reporter_id === 6 ? 'Vu Van F' :
       report.reporter_id === 7 ? 'Doan Van G' :
       report.reporter_id === 8 ? 'Bui Thi H' : 'Anonymous');
  }

  function renderHeader(r) {
    const formattedReportId = UiHelpers.formatReportId(r.report_id);
    const reporterName = resolveReporterName(r);
    return `
      <div class="bg-white rounded-xl shadow-sm border border-outline-variant/20 p-6 mb-6">
        <div class="flex items-start justify-between">
          <div>
            <h1 class="text-headline-md font-headline-md text-primary">Report ${formattedReportId}</h1>
            <p class="text-on-surface-variant text-body-sm mt-1">${UiHelpers.escapeHtml(r.room_name || r.room_id || 'N/A')}${r.asset_name ? ' · ' + UiHelpers.escapeHtml(r.asset_name) : ''} · reported by ${UiHelpers.escapeHtml(reporterName)}</p>
          </div>
        </div>
      </div>
    `;
  }

  function renderReportDetails(report, suggestions = []) {
    const reporterName = resolveReporterName(report);
    const isRejected = report.status === 'Rejected';
    const isPending = report.status === 'Pending Approval' || report.status === 'Pending';
    const equipment = report.asset_name || 'N/A';
    const assetType = report.asset_type || 'Facility / Classroom Equipment';
    const room = report.room_name || report.room_id || 'N/A';
    const backendBase = (window.APP_CONFIG && window.APP_CONFIG.API_BASE_URL ? window.APP_CONFIG.API_BASE_URL.replace('/api/v1', '') : 'http://localhost:4000');
    let rawImages = report.images;
    if (typeof rawImages === 'string') {
      try {
        rawImages = JSON.parse(rawImages);
      } catch (e) {
        rawImages = rawImages.split(',').map(s => s.trim()).filter(Boolean);
      }
    }
    let reportImages = [];
    if (rawImages && Array.isArray(rawImages) && rawImages.length > 0) {
      reportImages = rawImages.map(img => {
        if (!img) return '';
        const strImg = typeof img === 'object' && img.image_path ? img.image_path : String(img);
        return (strImg.startsWith('http') || strImg.startsWith('data:') ? strImg : (backendBase + strImg));
      }).filter(Boolean);
    } else if (report.image_path) {
      const url = (report.image_path.startsWith('http') || report.image_path.startsWith('data:') ? report.image_path : (backendBase + report.image_path));
      reportImages = [url];
    } else if (report.image_url) {
      const url = (report.image_url.startsWith('http') || report.image_url.startsWith('data:') ? report.image_url : (backendBase + report.image_url));
      reportImages = [url];
    }
    
    let rejectionInfo = {
      rejectedAt: report.rejected_at || report.updated_at || report.reported_at,
      reason: report.rejection_reason || report.reject_reason || ''
    };
    if (isRejected && (!rejectionInfo.reason || rejectionInfo.reason === 'No reason provided.')) {
      try {
        const stored = localStorage.getItem('vnu_rejected_info_' + cleanId) || localStorage.getItem('vnu_rejected_info_' + numericId);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed.reason) rejectionInfo.reason = parsed.reason;
          if (parsed.rejected_at) rejectionInfo.rejectedAt = parsed.rejected_at;
        }
      } catch (e) {}
    }
    if (!rejectionInfo.reason) rejectionInfo.reason = 'No reason provided.';

    let html = renderHeader(report);

    // ===== MAIN GRID =====
    html += `
      <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <!-- LEFT COLUMN (2 Cols) -->
        <div class="xl:col-span-2 space-y-6">

          ${isRejected ? `
            <!-- REJECTION REASON CARD -->
            <div class="bg-red-50/90 border border-red-200 rounded-2xl p-6 shadow-xs flex items-start gap-4">
              <div class="w-11 h-11 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0">
                <span class="material-symbols-outlined text-2xl">gavel</span>
              </div>
              <div class="flex-1 space-y-2">
                <div class="flex items-center justify-between flex-wrap gap-2">
                  <h3 class="text-title-medium font-bold text-red-900 flex items-center gap-2">
                    Report Rejected by Manager
                  </h3>
                  <span class="text-xs text-red-700 font-medium">${UiHelpers.formatDateTime(rejectionInfo.rejectedAt)}</span>
                </div>
                <p class="text-xs uppercase tracking-wider font-bold text-red-800">Rejection Reason</p>
                <div class="bg-white p-4 rounded-xl border border-red-200 text-body-md text-red-950 font-normal leading-relaxed whitespace-pre-line shadow-xs">
                  ${UiHelpers.escapeHtml(rejectionInfo.reason)}
                </div>
              </div>
            </div>
          ` : ''}

          <!-- ISSUE DETAILS CARD -->
          <div class="bg-white rounded-2xl shadow-sm border border-outline-variant/20 p-6 space-y-6">
            <div class="flex flex-wrap items-start justify-between gap-4">
              <div>
                <p class="text-label-md text-on-surface-variant">Issue summary</p>
                <h3 class="text-headline-sm font-headline-sm text-on-surface mt-1">${UiHelpers.escapeHtml(report.description || 'No description provided')}</h3>
              </div>
              <div class="rounded-full bg-primary-fixed px-3 py-1 text-sm font-semibold text-brand-blue">
                ${UiHelpers.escapeHtml(report.priority || 'Medium')}
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
              <div class="rounded-xl bg-surface-container-low p-4">
                <p class="text-label-md text-on-surface-variant">Equipment</p>
                <p class="text-body-md font-bold text-on-surface">${UiHelpers.escapeHtml(equipment)}</p>
              </div>
              <div class="rounded-xl bg-surface-container-low p-4">
                <p class="text-label-md text-on-surface-variant">Asset type</p>
                <p class="text-body-md font-medium text-on-surface mt-0.5">${UiHelpers.escapeHtml(assetType)}</p>
              </div>
              <div class="rounded-xl bg-surface-container-low p-4">
                <p class="text-label-md text-on-surface-variant">Room</p>
                <p class="text-body-md font-bold text-on-surface">${UiHelpers.escapeHtml(room)}</p>
              </div>
              <div class="rounded-xl bg-surface-container-low p-4">
                <p class="text-label-md text-on-surface-variant">Room ID</p>
                <p class="text-body-md font-medium text-on-surface mt-0.5">${UiHelpers.escapeHtml(report.room_id || report.room_name || 'N/A')}</p>
              </div>
              <div class="rounded-xl bg-surface-container-low p-4">
                <p class="text-label-md text-on-surface-variant">Reported by</p>
                <p class="text-body-md font-medium text-on-surface mt-0.5">${UiHelpers.escapeHtml(reporterName)}</p>
              </div>
              <div class="rounded-xl bg-surface-container-low p-4">
                <p class="text-label-md text-on-surface-variant">Reported date</p>
                <p class="text-body-md font-medium text-on-surface mt-0.5">${UiHelpers.formatDate(report.reported_at)}</p>
              </div>
            </div>

            <!-- Uploaded Evidence -->
            <div>
              <p class="text-label-md text-on-surface-variant mb-2 font-medium">Uploaded Evidence ${reportImages.length > 0 ? `(${reportImages.length})` : ''}</p>
              ${reportImages.length > 0 ? `
                <div class="flex items-center gap-3 flex-wrap">
                  ${reportImages.map((imgUrl, i) => `
                    <a href="${imgUrl}" target="_blank" class="block relative w-36 h-28 rounded-xl overflow-hidden border border-outline-variant/20 shadow-sm hover:shadow-md transition-all group bg-surface-container shrink-0">
                      <img src="${imgUrl}" alt="Uploaded Evidence ${i+1}" class="w-full h-full object-cover group-hover:scale-105 transition-transform" onError="this.onerror=null; this.parentElement.innerHTML='<div class=\\'w-full h-full bg-gray-100 flex flex-col items-center justify-center text-xs text-gray-400 p-2 text-center\\'><span class=\\'material-symbols-outlined text-2xl mb-1\\'>broken_image</span>Image ${i+1}</div>';" />
                      <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-xs font-bold gap-1">
                        <span class="material-symbols-outlined text-sm">visibility</span>
                        <span>View #${i+1}</span>
                      </div>
                    </a>
                  `).join('')}
                </div>
              ` : `
                <div class="w-44 h-28 rounded-xl border border-outline-variant/30 bg-surface-container-low flex flex-col items-center justify-center text-on-surface-variant p-4 text-center gap-1">
                  <span class="material-symbols-outlined text-3xl text-outline">image</span>
                  <span class="text-xs font-medium text-outline">No evidence attached</span>
                </div>
              `}
            </div>
          </div>

          ${isPending ? `
            <!-- APPROVE & ASSIGN FORM -->
            <div class="bg-white rounded-2xl shadow-sm border border-outline-variant/20 p-6 space-y-4">
              <h2 class="text-headline-sm font-headline-sm font-bold text-on-surface">Approve &amp; Assign Technician</h2>
              <p class="text-on-surface-variant text-body-sm">DSS2 suggestion: ranked by specialty match and current workload.</p>

              <div class="space-y-2.5 my-4">
                ${suggestions.map((s, i) => `
                  <label class="flex items-center justify-between p-3.5 rounded-xl border ${i === 0 ? 'border-brand-blue bg-blue-50/70' : 'border-outline-variant/30 hover:bg-surface-container-lowest'} cursor-pointer transition-all">
                    <div class="flex items-center gap-3">
                      <input type="radio" name="technicianId" value="${s.technicianId}" ${i === 0 ? 'checked' : ''} class="text-brand-blue focus:ring-brand-blue">
                      <div>
                        <p class="text-label-lg font-label-lg font-bold">${s.fullName} ${i === 0 ? '<span class="text-[10px] bg-brand-blue text-white px-2 py-0.5 rounded-full font-bold ml-1">RECOMMENDED</span>' : ''}</p>
                        <p class="text-[12px] text-on-surface-variant mt-0.5">${s.specialty || 'General'} ${s.specialtyMatch ? '· specialty match' : ''}</p>
                      </div>
                    </div>
                    <span class="text-body-sm font-medium text-on-surface-variant">${s.activeWorkload} active task(s)</span>
                  </label>
                `).join('')}
              </div>

              <div class="mb-4">
                <label class="text-label-md font-label-md text-on-surface-variant font-medium">Deadline</label>
                <input id="deadlineInput" type="datetime-local" class="mt-1 w-full rounded-xl border border-outline-variant/50 px-3.5 py-2.5 text-body-sm focus:border-brand-blue focus:ring-brand-blue" />
                <p class="text-[11px] text-on-surface-variant mt-1">Automatically defaults to 48 hours from now if left blank.</p>
              </div>

              <p id="assignError" class="hidden text-error text-body-sm bg-error-container/40 rounded-lg px-3 py-2 mb-3"></p>

              <div class="flex gap-3 pt-2">
                <button id="approveBtn" class="bg-brand-blue text-white text-label-lg font-label-lg px-6 py-2.5 rounded-xl hover:opacity-90 transition-all shadow-xs font-bold">Approve &amp; Assign</button>
                <button id="rejectBtn" class="border border-error text-error text-label-lg font-label-lg px-6 py-2.5 rounded-xl hover:bg-error/5 transition-all font-bold">Reject Report</button>
              </div>
            </div>

            <!-- REJECT REASON FORM -->
            <div id="rejectFormWrap" class="hidden bg-white rounded-2xl shadow-sm border border-red-200 p-6 space-y-3">
              <h2 class="text-headline-sm font-headline-sm font-bold text-red-900 flex items-center gap-2">
                <span class="material-symbols-outlined text-red-600">report_problem</span> Reject Report
              </h2>
              <label class="text-label-md font-label-md text-on-surface-variant font-medium">Reason for rejection *</label>
              <textarea id="rejectReason" rows="3" class="mt-1 w-full rounded-xl border border-outline-variant/50 px-3.5 py-2.5 text-body-sm focus:border-red-500 focus:ring-red-500"
                        placeholder="e.g. Duplicate report, not a facility issue, resolved self-service"></textarea>
              <p id="rejectError" class="hidden text-error text-body-sm"></p>
              <button id="confirmRejectBtn" class="mt-2 bg-error text-white text-label-lg font-label-lg px-6 py-2.5 rounded-xl hover:opacity-90 transition-all font-bold">Confirm Reject</button>
            </div>
          ` : ''}

        </div>

        <!-- RIGHT COLUMN (1 Col) -->
        <div class="space-y-6">
          <!-- TIMELINE CARD -->
          <div class="bg-white rounded-2xl shadow-sm border border-outline-variant/20 p-6 space-y-4">
            <h3 class="text-label-lg font-bold text-on-surface border-b border-outline-variant/10 pb-3 flex items-center gap-2">
              <span class="material-symbols-outlined text-brand-blue">history</span>
              <span>Report Timeline</span>
            </h3>
            
            <div class="relative pl-6 space-y-6 before:absolute before:left-2 before:top-2 before:bottom-2 before:w-0.5 before:bg-outline-variant/30">
              ${isRejected ? `
                <div class="relative">
                  <div class="absolute -left-6 top-1 w-4 h-4 rounded-full bg-red-500 ring-4 ring-white"></div>
                  <p class="text-body-sm font-bold text-red-600">Rejected</p>
                  <p class="text-xs text-on-surface-variant mt-0.5">${UiHelpers.formatDate(rejectionInfo.rejectedAt)}</p>
                  <p class="text-xs text-on-surface-variant/80 mt-1 italic">${UiHelpers.escapeHtml(rejectionInfo.reason)}</p>
                </div>
              ` : ''}

              ${!isRejected && !isPending ? `
                <div class="relative">
                  <div class="absolute -left-6 top-1 w-4 h-4 rounded-full bg-brand-blue ring-4 ring-white"></div>
                  <p class="text-body-sm font-bold text-brand-blue">${report.status}</p>
                  <p class="text-xs text-on-surface-variant mt-0.5">${UiHelpers.formatDate(report.updated_at || report.reported_at)}</p>
                </div>
              ` : ''}

              ${isPending ? `
                <div class="relative">
                  <div class="absolute -left-6 top-1 w-4 h-4 rounded-full bg-amber-400 ring-4 ring-white"></div>
                  <p class="text-body-sm font-bold text-amber-700">Pending Approval</p>
                  <p class="text-xs text-on-surface-variant mt-0.5">Awaiting Manager Review & Assignment</p>
                </div>
              ` : ''}

              <div class="relative">
                <div class="absolute -left-6 top-1 w-4 h-4 rounded-full bg-slate-300 ring-4 ring-white"></div>
                <p class="text-body-sm font-bold text-on-surface">Submitted</p>
                <p class="text-xs text-on-surface-variant mt-0.5">${UiHelpers.formatDate(report.reported_at)}</p>
                <p class="text-xs text-on-surface-variant/70 mt-0.5">Reported by ${UiHelpers.escapeHtml(reporterName)}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    return html;
  }

  const sourceTab = new URLSearchParams(location.search).get('tab') || 'pending';

  // Update back button link dynamically
  const backLink = document.getElementById('backLink');
  if (backLink) {
    backLink.href = `PendingRequest.html?tab=${sourceTab}`;
    const backLabel = sourceTab === 'pending'
      ? 'Pending Requests'
      : sourceTab === 'rejected'
        ? 'Rejected Reports'
        : 'Assigned Tasks';
    backLink.innerHTML = `<span class="material-symbols-outlined text-[18px]">arrow_back</span> Back to ${backLabel}`;
  }

  async function load() {
    let report = null;
    let suggestions = DEMO_SUGGESTIONS;

    try {
      if (window.Api) {
        report = await Api.get(`/fault-reports/${cleanId}`);
      }
    } catch (e) {
      console.log('API error, using demo fallback for report details:', e);
    }

    try {
      const localReports = JSON.parse(localStorage.getItem('vnu_user_reports') || '[]');
      const localMatch = localReports.find(r => 
        String(r.report_id || r.id).toLowerCase() === String(cleanId).toLowerCase() ||
        String(r.report_id || r.id).toLowerCase() === String(numericId).toLowerCase() ||
        (window.UiHelpers && UiHelpers.formatReportId(r.report_id || r.id).toLowerCase() === UiHelpers.formatReportId(cleanId).toLowerCase())
      );
      if (localMatch) {
        if (!report) {
          report = localMatch;
        } else if (localMatch.images && Array.isArray(localMatch.images) && localMatch.images.length > (report.images?.length || 0)) {
          report.images = localMatch.images;
        }
      }
    } catch (e) {}

    if (!report) {
      report = DEMO_REPORTS[cleanId] || DEMO_REPORTS[numericId] || DEMO_REPORTS['10'];
    }

    try {
      if (window.Api && (report.status === 'Pending Approval' || report.status === 'Pending')) {
        const apiSuggestions = await Api.get(`/work-orders/suggestions/${cleanId}`);
        if (apiSuggestions && Array.isArray(apiSuggestions) && apiSuggestions.length > 0) {
          suggestions = apiSuggestions;
        }
      }
    } catch (e) {}

    const content = document.getElementById('content');
    content.innerHTML = renderReportDetails(report, suggestions);

    const deadlineEl = document.getElementById('deadlineInput');
    if (deadlineEl && !deadlineEl.value) {
      const nowPlus48 = new Date(Date.now() + 48 * 60 * 60 * 1000);
      const pad = (n) => String(n).padStart(2, '0');
      deadlineEl.value = `${nowPlus48.getFullYear()}-${pad(nowPlus48.getMonth() + 1)}-${pad(nowPlus48.getDate())}T${pad(nowPlus48.getHours())}:${pad(nowPlus48.getMinutes())}`;
    }

    const approveBtn = document.getElementById('approveBtn');
    if (approveBtn) {
      approveBtn.addEventListener('click', async () => {
        const errorBox = document.getElementById('assignError');
        if (errorBox) errorBox.classList.add('hidden');
        const selected = document.querySelector('input[name="technicianId"]:checked');
        if (!selected) {
          if (window.showToast) showToast('Please select a technician!', 'warning');
          else alert('Please select a technician.');
          return;
        }

        const deadlineInput = document.getElementById('deadlineInput');
        const deadlineValue = deadlineInput ? deadlineInput.value : '';
        const deadlineAt = deadlineValue ? deadlineValue.replace('T', ' ') + ':00' : null;

        approveBtn.disabled = true;
        try {
          if (window.Api) {
            await Api.post('/work-orders', {
              reportId: Number(cleanId),
              technicianId: Number(selected.value),
              deadlineAt,
            });
          }
          if (window.showToast) showToast('Report approved and work order assigned successfully!', 'success');
          else alert(`Report approved and assigned successfully!`);
          setTimeout(() => {
            location.href = `PendingRequest.html?tab=${sourceTab}`;
          }, 1000);
        } catch (err) {
          if (window.showToast) showToast(`An error occurred: ${err.message}`, 'error');
          else alert(`Failed: ${err.message}`);
          approveBtn.disabled = false;
        }
      });
    }

    const rejectBtn = document.getElementById('rejectBtn');
    if (rejectBtn) {
      rejectBtn.addEventListener('click', () => {
        const rejectWrap = document.getElementById('rejectFormWrap');
        if (rejectWrap) {
          rejectWrap.classList.remove('hidden');
          rejectWrap.scrollIntoView({ behavior: 'smooth' });
        }
      });
    }

    const confirmRejectBtn = document.getElementById('confirmRejectBtn');
    if (confirmRejectBtn) {
      confirmRejectBtn.addEventListener('click', async () => {
        const errorBox = document.getElementById('rejectError');
        const reason = document.getElementById('rejectReason').value.trim();
        if (!reason) {
          if (errorBox) {
            errorBox.textContent = 'Please provide a reason.';
            errorBox.classList.remove('hidden');
          }
          if (window.showToast) showToast('Please provide a reason for rejection!', 'warning');
          return;
        }
        confirmRejectBtn.disabled = true;
        const nowIso = new Date().toISOString();
        try {
          if (window.Api) {
            await Api.patch(`/fault-reports/${cleanId}/status`, { status: 'Rejected', rejectionReason: reason });
          }
          try {
            const rejectedInfo = { reason: reason, rejected_at: nowIso };
            localStorage.setItem('vnu_rejected_info_' + cleanId, JSON.stringify(rejectedInfo));
            localStorage.setItem('vnu_rejected_info_' + numericId, JSON.stringify(rejectedInfo));
          } catch(e){}

          if (window.showToast) showToast('Report rejected successfully!', 'success');
          else alert(`Report rejected successfully.`);
          setTimeout(() => {
            location.href = `PendingRequestDetail.html?id=${cleanId}&tab=${sourceTab}`;
          }, 800);
        } catch (err) {
          if (window.showToast) showToast(`An error occurred: ${err.message}`, 'error');
          else alert(`Failed: ${err.message}`);
          confirmRejectBtn.disabled = false;
        }
      });
    }
  }

  load().catch(err => { 
    document.getElementById('content').innerHTML = `<p class="text-error">${err.message}</p>`; 
  });
</script>
</body>
</html>
