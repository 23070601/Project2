<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Detail - VNU-IS Asset Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/theme.config.js"></script>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}</style>
</head>
<body class="bg-surface text-on-surface overflow-x-hidden">

<div id="sidebar-placeholder"></div>

<div class="ml-[240px] flex flex-col min-h-screen">
  <div id="topbar-placeholder"></div>

  <main class="flex-1 p-8 max-w-[820px]">
    <a href="PendingRequest.html" class="text-brand-blue text-label-md font-label-md flex items-center gap-1 mb-4 hover:underline">
      <span class="material-symbols-outlined text-[18px]">arrow_back</span> Back to Requests
    </a>
    <div id="content" class="space-y-6"></div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/ui-helpers.js"></script>
<script>
  Auth.guard('Manager');
  Layout.init({ role: 'Manager', activePage: 'PendingRequest' });
  const reportId = new URLSearchParams(location.search).get('id');
  const cleanId = String(reportId || '10').replace(/^(#|FR-|REP-)+/gi, '');

  const DEMO_PENDING_REPORTS = {
    '10': { report_id: '10', reporter_name: 'Nguyen Van A', asset_name: 'Panasonic 4K Projector PT-VMZ51', room_name: 'R102', priority: 'High', status: 'Pending Approval', description: 'Panasonic Projector power light turns amber and powers down.', reported_at: '2026-07-29 08:00:00' },
    '2': { report_id: '2', reporter_name: 'Tran Thi B', asset_name: 'Daikin Inverter AC 18000 BTU', room_name: 'R401', priority: 'Medium', status: 'Pending Approval', description: 'Air conditioner is running but blowing warm air into the classroom.', reported_at: '2026-07-28 14:00:00' },
    '7': { report_id: '7', reporter_name: 'Nguyen Van A', asset_name: 'Daikin Inverter AC 18000 BTU', room_name: 'R301', priority: 'Medium', status: 'Pending Approval', description: 'Air conditioner leaking water heavily onto student desks.', reported_at: '2026-07-29 07:00:00' }
  };

  const DEMO_SUGGESTIONS = [
    { technicianId: 3, fullName: 'Le Van C', specialty: 'Projector / Display', specialtyMatch: true, activeWorkload: 1 },
    { technicianId: 4, fullName: 'Pham Thi D', specialty: 'Audio / TV / Switch', specialtyMatch: false, activeWorkload: 2 },
    { technicianId: 6, fullName: 'Vu Van F', specialty: 'Microphone / Electronics', specialtyMatch: false, activeWorkload: 0 }
  ];

  function renderHeader(r) {
    const formattedReportId = UiHelpers.formatReportId(r.report_id);
    return `
      <div class="bg-white rounded-xl shadow-sm border border-outline-variant/20 p-6">
        <div class="flex items-start justify-between">
          <div>
            <h1 class="text-headline-md font-headline-md text-primary">Report ${formattedReportId}</h1>
            <p class="text-on-surface-variant text-body-sm mt-1">${r.room_name}${r.asset_name ? ' · ' + r.asset_name : ''} · reported by ${r.reporter_name}</p>
          </div>
          <div class="flex gap-2">${UiHelpers.priorityBadge(r.priority)}${UiHelpers.statusBadge(r.status)}</div>
        </div>
        <p class="text-body-md mt-4 whitespace-pre-line">${UiHelpers.escapeHtml(r.description)}</p>
        <p class="text-on-surface-variant text-body-sm mt-4">Reported at ${UiHelpers.formatDate(r.reported_at)}</p>
      </div>`;
  }

  function renderAssignForm(suggestions) {
    return `
      <div class="bg-white rounded-xl shadow-sm border border-outline-variant/20 p-6">
        <h2 class="text-headline-sm font-headline-sm mb-1">Approve &amp; Assign Technician</h2>
        <p class="text-on-surface-variant text-body-sm mb-4">DSS2 suggestion: ranked by specialty match and current workload.</p>

        <div class="space-y-2 mb-5">
          ${suggestions.map((s, i) => `
            <label class="flex items-center justify-between p-3 rounded-lg border ${i === 0 ? 'border-brand-blue bg-blue-50' : 'border-outline-variant/30'} cursor-pointer">
              <div class="flex items-center gap-3">
                <input type="radio" name="technicianId" value="${s.technicianId}" ${i === 0 ? 'checked' : ''}>
                <div>
                  <p class="text-label-lg font-label-lg">${s.fullName} ${i === 0 ? '<span class="text-[10px] text-brand-blue font-bold ml-1">RECOMMENDED</span>' : ''}</p>
                  <p class="text-[11px] text-on-surface-variant">${s.specialty || 'General'} ${s.specialtyMatch ? '· specialty match' : ''}</p>
                </div>
              </div>
              <span class="text-body-sm text-on-surface-variant">${s.activeWorkload} active task(s)</span>
            </label>
          `).join('')}
        </div>

        <p id="assignError" class="hidden text-error text-body-sm bg-error-container/40 rounded-lg px-3 py-2 mb-3"></p>

        <div class="flex gap-3">
          <button id="approveBtn" class="bg-brand-blue text-white text-label-lg font-label-lg px-5 py-2.5 rounded-lg hover:opacity-90">Approve &amp; Assign</button>
          <button id="rejectBtn" class="border border-error text-error text-label-lg font-label-lg px-5 py-2.5 rounded-lg hover:bg-error/5">Reject Report</button>
        </div>
      </div>

      <div id="rejectFormWrap" class="hidden bg-white rounded-xl shadow-sm border border-outline-variant/20 p-6">
        <h2 class="text-headline-sm font-headline-sm mb-3">Reject Report</h2>
        <label class="text-label-md font-label-md text-on-surface-variant">Reason *</label>
        <textarea id="rejectReason" rows="3" class="mt-1 w-full rounded-lg border border-outline-variant/50 px-3 py-2 text-body-sm"
                  placeholder="e.g. Duplicate report, not a facility issue"></textarea>
        <p id="rejectError" class="hidden text-error text-body-sm mt-2"></p>
        <button id="confirmRejectBtn" class="mt-3 bg-error text-white text-label-lg font-label-lg px-5 py-2.5 rounded-lg hover:opacity-90">Confirm Reject</button>
      </div>`;
  }

  const sourceTab = new URLSearchParams(location.search).get('tab') || 'pending';

  // Update back button link dynamically
  const backLink = document.querySelector('main a');
  if (backLink) {
    backLink.href = `PendingRequest.html?tab=${sourceTab}`;
    backLink.innerHTML = `<span class="material-symbols-outlined text-[18px]">arrow_back</span> Back to ${sourceTab === 'pending' ? 'Pending Requests' : 'Assigned Tasks'}`;
  }

  async function load() {
    let report = null;
    let suggestions = DEMO_SUGGESTIONS;

    try {
      if (window.Api) {
        report = await Api.get(`/fault-reports/${cleanId}`);
      }
    } catch (e) {
      console.log('API error, using demo fallback for report details:', e);
    }

    if (!report) {
      report = DEMO_PENDING_REPORTS[cleanId] || DEMO_PENDING_REPORTS['10'];
    }

    try {
      if (window.Api && report.status === 'Pending Approval') {
        const apiSuggestions = await Api.get(`/work-orders/suggestions/${cleanId}`);
        if (apiSuggestions && Array.isArray(apiSuggestions) && apiSuggestions.length > 0) {
          suggestions = apiSuggestions;
        }
      }
    } catch (e) {}

    let html = renderHeader(report);

    if (report.status === 'Pending Approval') {
      html += renderAssignForm(suggestions);
    } else {
      html += `<div class="bg-surface-container-low rounded-xl p-6 text-body-sm text-on-surface-variant">This report is no longer pending approval.</div>`;
    }

    content.innerHTML = html;

    const approveBtn = document.getElementById('approveBtn');
    if (approveBtn) {
      approveBtn.addEventListener('click', async () => {
        const errorBox = document.getElementById('assignError');
        if (errorBox) errorBox.classList.add('hidden');
        const selected = document.querySelector('input[name="technicianId"]:checked');
        if (!selected) {
          if (window.showToast) showToast('Vui lòng chọn kỹ thuật viên!', 'warning');
          else alert('Please select a technician.');
          return;
        }
        approveBtn.disabled = true;
        try {
          if (window.Api) {
            await Api.post('/work-orders', { reportId: Number(cleanId), technicianId: Number(selected.value) });
          }
          if (window.showToast) showToast('Đã duyệt báo cáo và gán công việc thành công!', 'success');
          else alert(`Report approved and assigned successfully!`);
          setTimeout(() => {
            location.href = `PendingRequest.html?tab=${sourceTab}`;
          }, 1000);
        } catch (err) {
          if (window.showToast) showToast(`Có lỗi xảy ra: ${err.message}`, 'error');
          else alert(`Failed: ${err.message}`);
          approveBtn.disabled = false;
        }
      });
    }

    const rejectBtn = document.getElementById('rejectBtn');
    if (rejectBtn) {
      rejectBtn.addEventListener('click', () => {
        document.getElementById('rejectFormWrap').classList.remove('hidden');
        document.getElementById('rejectFormWrap').scrollIntoView({ behavior: 'smooth' });
      });
    }

    const confirmRejectBtn = document.getElementById('confirmRejectBtn');
    if (confirmRejectBtn) {
      confirmRejectBtn.addEventListener('click', async () => {
        const errorBox = document.getElementById('rejectError');
        const reason = document.getElementById('rejectReason').value.trim();
        if (!reason) {
          if (errorBox) {
            errorBox.textContent = 'Please provide a reason.';
            errorBox.classList.remove('hidden');
          }
          if (window.showToast) showToast('Vui lòng cung cấp lý do từ chối!', 'warning');
          return;
        }
        confirmRejectBtn.disabled = true;
        try {
          if (window.Api) {
            await Api.patch(`/fault-reports/${cleanId}/status`, { status: 'Rejected', rejectionReason: reason });
          }
          if (window.showToast) showToast('Đã từ chối báo cáo thành công!', 'success');
          else alert(`Report rejected successfully.`);
          setTimeout(() => {
            location.href = `PendingRequest.html?tab=${sourceTab}`;
          }, 1000);
        } catch (err) {
          if (window.showToast) showToast(`Có lỗi xảy ra: ${err.message}`, 'error');
          else alert(`Failed: ${err.message}`);
          confirmRejectBtn.disabled = false;
        }
      });
    }
  }

  load().catch(err => { content.innerHTML = `<p class="text-error">${err.message}</p>`; });
</script>
</body>
</html>
