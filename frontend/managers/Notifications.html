<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Notifications - VNU-IS Asset Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/theme.config.js"></script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
</style>
</head>
<body class="bg-surface text-on-surface overflow-hidden">

<!-- SIDEBAR PLACEHOLDER -->
<div id="sidebar-placeholder"></div>

<!-- MAIN WRAPPER -->
<div class="ml-[240px] flex flex-col h-screen">
  <!-- TOP APP BAR PLACEHOLDER -->
  <div id="topbar-placeholder"></div>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1 overflow-y-auto bg-surface p-8 pb-32">
    <!-- Header Title & Mark All as Read Button -->
    <div class="mb-8 flex items-center justify-between">
      <h1 class="text-headline-lg font-headline-lg text-on-surface">Notifications</h1>
      <button id="markAllReadPageBtn" class="bg-primary text-on-primary px-4 py-2 rounded-lg font-label-lg hover:opacity-90 transition-all focus:outline-none">
        Mark All as Read
      </button>
    </div>

    <!-- Filter Tabs (All / Unread / Read) -->
    <div class="flex items-center gap-8 border-b border-outline-variant/20 mb-6">
      <button id="tabAll" class="pb-3 text-primary border-b-2 border-primary font-label-lg tab-btn focus:outline-none" onclick="filterNotifications('all')">
        All
      </button>
      <button id="tabUnread" class="pb-3 text-on-surface-variant hover:text-on-surface font-label-lg flex items-center gap-2 tab-btn focus:outline-none" onclick="filterNotifications('unread')">
        Unread <span id="unreadTabCount" class="bg-primary text-on-primary text-[10px] px-1.5 py-0.5 rounded-full font-bold hidden">0</span>
      </button>
      <button id="tabRead" class="pb-3 text-on-surface-variant hover:text-on-surface font-label-lg tab-btn focus:outline-none" onclick="filterNotifications('read')">
        Read
      </button>
    </div>

    <!-- Notifications List Container -->
    <div id="notificationFullList" class="space-y-4">
      <div class="p-8 text-center text-on-surface-variant">Loading notifications...</div>
    </div>

    <!-- Empty State Container (Hidden by default) -->
    <div id="emptyStateBox" class="hidden bg-white p-12 rounded-xl border border-outline-variant/20 flex flex-col items-center justify-center text-center my-6">
      <span class="material-symbols-outlined text-5xl text-outline-variant mb-3">mark_chat_read</span>
      <h4 id="emptyStateTitle" class="text-body-md font-bold text-on-surface">No unread notifications</h4>
      <p id="emptyStateDesc" class="text-label-md text-on-surface-variant mt-1 max-w-md">You are all caught up! There are no unread notifications at the moment.</p>
    </div>
  </main>

  <!-- FOOTER PLACEHOLDER -->
  <div id="footer-placeholder"></div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/notifications.js"></script>
<script>
  let currentUser = { full_name: 'Hoang Van E', role: 'Manager' };
  try {
    const user = Auth.guard('Manager');
    if (user) currentUser = user;
  } catch (e) {
    console.log('Running in demo mode without auth session');
  }

  Layout.init({ role: 'Manager', activePage: 'Notifications' });

  let allNotifications = [];
  let currentFilter = 'all';

  function updateUnreadTabCount() {
    const countEl = document.getElementById('unreadTabCount');
    if (countEl) {
      const unreadCount = allNotifications.filter((n) => !n.is_read).length;
      countEl.textContent = unreadCount;
      countEl.classList.toggle('hidden', unreadCount === 0);
      countEl.style.display = unreadCount > 0 ? 'inline-flex' : 'none';
    }
  }

  function renderNotifications() {
    const container = document.getElementById('notificationFullList');
    const emptyBox = document.getElementById('emptyStateBox');
    const emptyTitle = document.getElementById('emptyStateTitle');
    const emptyDesc = document.getElementById('emptyStateDesc');

    const visibleItems = allNotifications.filter((n) => {
      if (currentFilter === 'unread') return !n.is_read;
      if (currentFilter === 'read') return n.is_read;
      return true;
    });

    if (visibleItems.length === 0) {
      if (container) container.innerHTML = '';
      if (emptyBox) emptyBox.classList.remove('hidden');
      if (emptyTitle && emptyDesc) {
        if (currentFilter === 'unread') {
          emptyTitle.textContent = 'No unread notifications';
          emptyDesc.textContent = 'You are all caught up! There are no unread notifications at the moment.';
        } else if (currentFilter === 'read') {
          emptyTitle.textContent = 'No read notifications';
          emptyDesc.textContent = 'You have not read any notifications yet.';
        } else {
          emptyTitle.textContent = 'No notifications';
          emptyDesc.textContent = 'You do not have any notifications.';
        }
      }
      return;
    }

    if (emptyBox) emptyBox.classList.add('hidden');
    if (container) {
      container.innerHTML = visibleItems.map((n) => `
        <div class="notif-card ${!n.is_read ? 'bg-primary-fixed/20 border-primary-fixed/40' : 'bg-white border-outline-variant/20'} p-4 rounded-xl border flex items-start gap-4 relative cursor-pointer hover:${!n.is_read ? 'bg-primary-fixed/30' : 'bg-surface-container-low'} transition-colors"
             data-id="${n.notification_id}">
          <div class="w-2 h-2 ${!n.is_read ? 'bg-primary' : 'bg-transparent'} rounded-full mt-2 shrink-0"></div>
          <div class="flex-1">
            <div class="flex justify-between items-start gap-3">
              <h4 class="text-body-md font-${!n.is_read ? 'bold' : 'medium'} text-on-surface">${n.title}</h4>
              <span class="text-label-md text-on-surface-variant">${Notifications.timeAgo(n.created_at)}</span>
            </div>
            <p class="text-body-sm text-on-surface-variant mt-1">${n.message}</p>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.notif-card').forEach((card) => {
        card.addEventListener('click', async () => {
          const id = card.dataset.id;
          const target = allNotifications.find((item) => String(item.notification_id) === String(id));
          if (target && !target.is_read) {
            target.is_read = true;
            renderNotifications();
            updateUnreadTabCount();
            await Notifications.markNotificationAsRead(id, target);
          }
          if (target) {
            const route = Notifications.resolveNotificationTarget(target);
            window.location.href = route;
          }
        });
      });
    }
  }

  function filterNotifications(filterType) {
    currentFilter = filterType;
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach((t) => {
      t.classList.remove('text-primary', 'border-b-2', 'border-primary');
      t.classList.add('text-on-surface-variant');
    });

    if (filterType === 'all') {
      document.getElementById('tabAll').classList.add('text-primary', 'border-b-2', 'border-primary');
      document.getElementById('tabAll').classList.remove('text-on-surface-variant');
    } else if (filterType === 'unread') {
      document.getElementById('tabUnread').classList.add('text-primary', 'border-b-2', 'border-primary');
      document.getElementById('tabUnread').classList.remove('text-on-surface-variant');
    } else if (filterType === 'read') {
      document.getElementById('tabRead').classList.add('text-primary', 'border-b-2', 'border-primary');
      document.getElementById('tabRead').classList.remove('text-on-surface-variant');
    }

    renderNotifications();
  }

  async function loadPageNotifications() {
    try {
      allNotifications = await Notifications.loadFullList('#notificationFullList');
    } catch (e) {
      console.warn('Failed to load manager notifications', e);
      allNotifications = [];
    }
    updateUnreadTabCount();
    renderNotifications();
  }

  document.getElementById('markAllReadPageBtn').addEventListener('click', async () => {
    await Notifications.markAllAsRead();
    allNotifications = allNotifications.map((n) => ({ ...n, is_read: true }));
    updateUnreadTabCount();
    renderNotifications();
  });

  loadPageNotifications();
</script>

</body>
</html>
