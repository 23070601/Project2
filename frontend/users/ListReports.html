<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>My Reports - VNU-IS Asset Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/theme.config.js"></script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .bg-brand-blue {
    background-color: #005BAC;
  }
  .text-brand-blue {
    color: #005BAC;
  }
  .hover\:bg-brand-blue-light:hover {
    background-color: #D6EBFF;
  }
  .border-brand-blue {
    border-color: #005BAC;
  }
</style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col overflow-x-hidden">

<!-- Sidebar placeholder -->
<div id="sidebar-placeholder"></div>

<div class="flex-1 flex flex-col ml-[240px]">
  <!-- Topbar placeholder -->
  <div id="topbar-placeholder"></div>

  <!-- Main Content -->
  <main class="p-margin-desktop bg-surface min-h-[calc(100vh-60px-40px)] mb-[40px]">
    <!-- Header Section -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-headline-lg font-headline-lg text-on-surface">My Reports</h1>
        <p class="text-body-md text-on-surface-variant">Overview and management of all your facility maintenance requests.</p>
      </div>
      <a href="CreateReport.html" class="inline-flex items-center justify-center gap-2 px-6 py-2.5 bg-brand-blue text-white rounded-lg font-label-lg shadow-md hover:opacity-90 transition-all active:scale-95">
        <span class="material-symbols-outlined">add</span>
        <span>Create New Report</span>
      </a>
    </div>

    <!-- Status Quick Filter Tabs -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 mb-4 no-scrollbar" id="statusTabsContainer">
      <button type="button" data-status="" class="status-tab-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm bg-brand-blue text-white cursor-pointer">
        All <span class="ml-1 text-xs px-2 py-0.5 rounded-full bg-white/20 font-bold" id="countAll">0</span>
      </button>
      <button type="button" data-status="Pending Approval" class="status-tab-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white text-on-surface-variant hover:bg-surface-container-high border border-outline-variant/30 cursor-pointer">
        Pending Approval <span class="ml-1 text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 font-bold" id="countPending">0</span>
      </button>
      <button type="button" data-status="In Progress" class="status-tab-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white text-on-surface-variant hover:bg-surface-container-high border border-outline-variant/30 cursor-pointer">
        In Progress <span class="ml-1 text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-800 font-bold" id="countInProgress">0</span>
      </button>
      <button type="button" data-status="Completed" class="status-tab-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white text-on-surface-variant hover:bg-surface-container-high border border-outline-variant/30 cursor-pointer">
        Completed <span class="ml-1 text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-800 font-bold" id="countCompleted">0</span>
      </button>
      <button type="button" data-status="Rejected" class="status-tab-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white text-on-surface-variant hover:bg-surface-container-high border border-outline-variant/30 cursor-pointer">
        Rejected / Cancelled <span class="ml-1 text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-800 font-bold" id="countRejected">0</span>
      </button>
    </div>

    <!-- Control Row -->
    <div class="bg-surface-container-lowest p-4 rounded-xl shadow-sm mb-6 flex flex-wrap items-center justify-between gap-4 border border-outline-variant/30">
      <div class="flex-1 min-w-[260px] relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">search</span>
        <input id="searchInput" class="w-full pl-10 pr-9 py-2.5 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-body-md" placeholder="Search by ID, Equipment, Room, Description..." type="text">
        <button id="clearSearchBtn" type="button" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface text-sm p-1 rounded-full">
          <span class="material-symbols-outlined text-sm">close</span>
        </button>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <!-- Priority Filter -->
        <div class="flex items-center gap-2">
          <span class="text-label-md text-on-surface-variant shrink-0 font-medium">Priority:</span>
          <select id="priorityFilter" class="pl-3 pr-8 py-2 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-body-sm cursor-pointer appearance-none bg-[url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-[length:1em_1em] bg-[right_0.5rem_center] bg-no-repeat">
            <option value="">All Priorities</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>
        </div>

        <!-- Sort By Dropdown -->
        <div class="flex items-center gap-2">
          <span class="text-label-md text-on-surface-variant shrink-0 font-medium">Sort:</span>
          <select id="sortBySelect" class="pl-3 pr-8 py-2 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-body-sm cursor-pointer appearance-none bg-[url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-[length:1em_1em] bg-[right_0.5rem_center] bg-no-repeat">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Data Table Card -->
    <div class="bg-white rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-brand-blue text-white">
              <th class="py-4 px-6 font-label-lg uppercase tracking-wider text-label-md">#</th>
              <th class="py-4 px-6 font-label-lg uppercase tracking-wider text-label-md">Report ID</th>
              <th class="py-4 px-6 font-label-lg uppercase tracking-wider text-label-md">Equipment</th>
              <th class="py-4 px-6 font-label-lg uppercase tracking-wider text-label-md">Room</th>
              <th class="py-4 px-6 font-label-lg uppercase tracking-wider text-label-md">Priority</th>
              <th class="py-4 px-6 font-label-lg uppercase tracking-wider text-label-md">Date</th>
              <th class="py-4 px-6 font-label-lg uppercase tracking-wider text-label-md">Status</th>
              <th class="py-4 px-6 font-label-lg uppercase tracking-wider text-label-md text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="reportsTableBody" class="divide-y divide-outline-variant/20">
            <!-- Data will be loaded dynamically -->
          </tbody>
        </table>
        <p id="emptyState" class="hidden text-center text-on-surface-variant py-8">No reports found.</p>
      </div>
      <!-- Pagination Section -->
      <div class="px-6 py-4 bg-surface-container-low border-t border-outline-variant/30 flex flex-col sm:flex-row items-center justify-between gap-4">
        <p id="paginationInfo" class="text-body-sm text-on-surface-variant">Showing 0 entries</p>
        <nav id="paginationNav" class="flex items-center gap-2">
          <!-- Pagination buttons will be generated -->
        </nav>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/ui-helpers.js"></script>
<script>
  // Helper functions
  const priorityBadge = (priority) => {
    const colors = {
      'Low': 'bg-green-100 text-green-800',
      'Medium': 'bg-yellow-100 text-yellow-800',
      'High': 'bg-orange-100 text-orange-800',
      'Critical': 'bg-red-100 text-red-800'
    };
    return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${colors[priority] || 'bg-gray-100 text-gray-800'}">${priority || 'N/A'}</span>`;
  };

  const statusBadge = (status) => {
    const colors = {
      'Pending': 'bg-yellow-100 text-yellow-800 border border-yellow-200',
      'Pending Approval': 'bg-yellow-100 text-yellow-800 border border-yellow-200',
      'Processing': 'bg-blue-100 text-blue-800 border border-blue-200',
      'In Progress': 'bg-blue-100 text-blue-800 border border-blue-200',
      'Completed': 'bg-green-100 text-green-800 border border-green-200',
      'Resolved': 'bg-green-100 text-green-800 border border-green-200',
      'Closed': 'bg-gray-600 text-white border border-gray-700 font-bold',
      'Rejected': 'bg-red-100 text-red-800 border border-red-200',
      'Cancelled': 'bg-gray-100 text-gray-800 border border-gray-200'
    };
    return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${colors[status] || 'bg-gray-100 text-gray-800'}">${status || 'N/A'}</span>`;
  };

  const formatDate = (dateStr) => {
    if (!dateStr) return '-';
    try {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    } catch {
      return dateStr;
    }
  };

  function getFieldValue(obj, fieldNames, defaultValue = 'N/A') {
    for (const field of fieldNames) {
      if (obj[field] !== undefined && obj[field] !== null && obj[field] !== '') {
        return obj[field];
      }
    }
    return defaultValue;
  }

  // Main logic
  (function() {
    // 1. Get user from Auth
    const user = Auth.getCurrentUser();
    if (!user) {
      window.location.href = 'Login.html';
      return;
    }

    // 2. Initialize Layout
    Layout.init({ 
      role: user.role || 'User', 
      activePage: 'ListReports' 
    });

    // 3. State
    let allReports = [];
    let filteredReports = [];
    let currentPage = 1;
    let currentStatus = '';
    const itemsPerPage = 5;

    // DOM elements
    const tbody = document.getElementById('reportsTableBody');
    const emptyState = document.getElementById('emptyState');
    const paginationInfo = document.getElementById('paginationInfo');
    const paginationNav = document.getElementById('paginationNav');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const priorityFilter = document.getElementById('priorityFilter');
    const statusTabBtns = document.querySelectorAll('.status-tab-btn');

    // Danh mục báo cáo seed chuẩn từ SQL database (vnuis_asset_maintenance_dss.sql) theo từng user_id
    const DEMO_REPORTS_BY_USER = {
      1: [ // Lecturer A (lecturer.a@vnuis.edu.vn)
        { report_id: 'REP-0010', equipment_name: 'Panasonic 4K Laser Projector', room_name: 'Room 102', priority: 'High', reported_at: '2026-07-28 21:38:35', status: 'Pending Approval', reporter_id: 1, user_email: 'lecturer.a@vnuis.edu.vn' },
        { report_id: 'REP-0007', equipment_name: 'Daikin Inverter AC 18000 BTU', room_name: 'Room 301', priority: 'Medium', reported_at: '2026-07-28 20:38:35', status: 'Pending Approval', reporter_id: 1, user_email: 'lecturer.a@vnuis.edu.vn' },
        { report_id: 'REP-0001', equipment_name: 'Sony Laser Projector VPL-PHZ60', room_name: 'Room 302', priority: 'High', reported_at: '2026-07-26 23:38:35', status: 'Processing', reporter_id: 1, user_email: 'lecturer.a@vnuis.edu.vn' },
        { report_id: 'REP-0003', equipment_name: 'Samsung 75in Commercial TV', room_name: 'Room 101', priority: 'High', reported_at: '2026-07-23 23:38:35', status: 'Completed', reporter_id: 1, user_email: 'lecturer.a@vnuis.edu.vn' },
        { report_id: 'REP-0014', equipment_name: 'Ceiling Speaker R104', room_name: 'Room 104', priority: 'Low', reported_at: '2026-07-21 23:38:35', status: 'Cancelled', reporter_id: 1, user_email: 'lecturer.a@vnuis.edu.vn' }
      ],
      2: [ // Student B (student.b@vnuis.edu.vn)
        { report_id: 'REP-0002', equipment_name: 'Daikin Inverter AC 18000 BTU', room_name: 'Room 401', priority: 'Medium', reported_at: '2026-07-27 23:38:35', status: 'Pending Approval', reporter_id: 2, user_email: 'student.b@vnuis.edu.vn' },
        { report_id: 'REP-0004', equipment_name: 'JBL Classroom Wall Speaker', room_name: 'Room 401', priority: 'Low', reported_at: '2026-07-25 23:38:35', status: 'Rejected', reporter_id: 2, user_email: 'student.b@vnuis.edu.vn' },
        { report_id: 'REP-0011', equipment_name: 'Samsung 75in Commercial TV', room_name: 'Room 103', priority: 'Medium', reported_at: '2026-07-22 23:38:35', status: 'Completed', reporter_id: 2, user_email: 'student.b@vnuis.edu.vn' }
      ],
      7: [ // Lecturer G (lecturer.g@vnuis.edu.vn)
        { report_id: 'REP-0015', equipment_name: 'Gigabit Switch R601', room_name: 'Room 601', priority: 'High', reported_at: '2026-07-29 08:38:35', status: 'Closed', reporter_id: 7, user_email: 'lecturer.g@vnuis.edu.vn' },
        { report_id: 'REP-0008', equipment_name: 'Samsung 75in Commercial TV', room_name: 'Room 302', priority: 'High', reported_at: '2026-07-28 11:38:35', status: 'Processing', reporter_id: 7, user_email: 'lecturer.g@vnuis.edu.vn' },
        { report_id: 'REP-0005', equipment_name: 'Ultra HD 4K HDMI Cable', room_name: 'Room 302', priority: 'Low', reported_at: '2026-07-25 23:38:35', status: 'Cancelled', reporter_id: 7, user_email: 'lecturer.g@vnuis.edu.vn' },
        { report_id: 'REP-0012', equipment_name: 'Shure Wireless Dual Microphone', room_name: 'Room 503', priority: 'Low', reported_at: '2026-07-22 23:38:35', status: 'Completed', reporter_id: 7, user_email: 'lecturer.g@vnuis.edu.vn' }
      ],
      8: [ // Student H (student.h@vnuis.edu.vn)
        { report_id: 'REP-0009', equipment_name: 'Shure Wireless Dual Microphone', room_name: 'Room 303', priority: 'Medium', reported_at: '2026-07-28 23:38:35', status: 'Processing', reporter_id: 8, user_email: 'student.h@vnuis.edu.vn' },
        { report_id: 'REP-0006', equipment_name: 'Epson HD Document Camera', room_name: 'Room 503', priority: 'Medium', reported_at: '2026-07-28 17:38:35', status: 'Processing', reporter_id: 8, user_email: 'student.h@vnuis.edu.vn' },
        { report_id: 'REP-0013', equipment_name: 'Cisco Catalyst 24-Port Switch', room_name: 'Room 101', priority: 'High', reported_at: '2026-07-24 23:38:35', status: 'Rejected', reporter_id: 8, user_email: 'student.h@vnuis.edu.vn' }
      ]
    };

    // 4. Load reports from API, Local Storage & Mock Data
    async function loadReports() {
      let apiReports = [];
      try {
        const reports = await Api.get('/fault-reports', { mine: 'true' });
        if (Array.isArray(reports) && reports.length > 0) {
          apiReports = reports;
        }
      } catch (err) {
        console.error('Failed to load reports from API:', err);
      }

      let localReports = [];
      try {
        localReports = JSON.parse(localStorage.getItem('vnu_user_reports') || '[]');
      } catch (e) {}

      let deletedReports = [];
      try {
        deletedReports = JSON.parse(localStorage.getItem('vnu_deleted_reports') || '[]');
      } catch (e) {}

      const reportMap = new Map();

      const isDeleted = (id) => {
        if (!id) return false;
        const formatted = UiHelpers.formatReportId(id);
        const raw = String(id).replace(/\D/g, '');
        return deletedReports.includes(formatted) || (raw && deletedReports.includes(raw)) || deletedReports.includes(String(id));
      };

      // 1. Put seed reports matching the logged-in user ID
      const userSeedReports = DEMO_REPORTS_BY_USER[user.user_id] || DEMO_REPORTS_BY_USER[1];
      userSeedReports.forEach(r => {
        if (r && r.report_id && !isDeleted(r.report_id)) {
          r.report_id = UiHelpers.formatReportId(r.report_id);
          reportMap.set(r.report_id, r);
        }
      });

      // 2. Put API reports
      apiReports.forEach(r => {
        if (r && r.report_id && !isDeleted(r.report_id)) {
          const formattedId = UiHelpers.formatReportId(r.report_id);
          const existing = reportMap.get(formattedId);
          if (existing) {
            Object.assign(existing, r, { report_id: formattedId });
          } else {
            r.report_id = formattedId;
            reportMap.set(formattedId, r);
          }
        }
      });

      // 3. Put locally created reports & status overrides on top (filtered by current user)
      localReports.forEach(r => {
        if (r && r.report_id && !isDeleted(r.report_id)) {
          const isBelongsToUser = (!r.user_email && !r.reporter_id) || r.user_email === user.email || String(r.reporter_id) === String(user.user_id);
          if (isBelongsToUser) {
            const formattedId = UiHelpers.formatReportId(r.report_id);
            const existing = reportMap.get(formattedId);
            if (existing) {
              if (r.status) existing.status = r.status;
            } else {
              r.report_id = formattedId;
              reportMap.set(formattedId, r);
            }
          }
        }
      });

      // Check all reports in reportMap for local confirmation or reopen state overrides
      reportMap.forEach((rep, rId) => {
        try {
          const savedReopen = localStorage.getItem('vnu_reopened_' + rId) || localStorage.getItem('vnu_reopened_' + rep.report_id);
          if (savedReopen) {
            rep.status = 'Processing';
          } else {
            const savedConfirm = localStorage.getItem('vnu_confirmation_' + rId) || localStorage.getItem('vnu_confirmation_' + rep.report_id);
            if (savedConfirm) {
              const c = JSON.parse(savedConfirm);
              if (c && c.is_confirmed) {
                rep.status = 'Closed';
              }
            }
          }
        } catch(e) {}
      });

      allReports = Array.from(reportMap.values()).sort((a, b) => {
        return new Date(b.reported_at || 0) - new Date(a.reported_at || 0);
      });

      updateStatusCounts();
      applyFilters();
    }

    // Update status tab badge counts dynamically
    function updateStatusCounts() {
      const counts = {
        All: allReports.length,
        Pending: 0,
        InProgress: 0,
        Completed: 0,
        Rejected: 0
      };

      allReports.forEach(report => {
        const s = report.display_status || report.status || '';
        if (['Pending', 'Pending Approval'].includes(s)) {
          counts.Pending++;
        } else if (['In Progress', 'Processing'].includes(s)) {
          counts.InProgress++;
        } else if (['Completed', 'Resolved', 'Closed'].includes(s)) {
          counts.Completed++;
        } else if (['Rejected', 'Cancelled'].includes(s)) {
          counts.Rejected++;
        }
      });

      const countAll = document.getElementById('countAll');
      const countPending = document.getElementById('countPending');
      const countInProgress = document.getElementById('countInProgress');
      const countCompleted = document.getElementById('countCompleted');
      const countRejected = document.getElementById('countRejected');

      if (countAll) countAll.textContent = counts.All;
      if (countPending) countPending.textContent = counts.Pending;
      if (countInProgress) countInProgress.textContent = counts.InProgress;
      if (countCompleted) countCompleted.textContent = counts.Completed;
      if (countRejected) countRejected.textContent = counts.Rejected;
    }

    // 5. Apply filters & sorting
    function applyFilters() {
      const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const priorityValue = priorityFilter ? priorityFilter.value : '';
      const sortValue = sortBySelect ? sortBySelect.value : 'newest';

      filteredReports = allReports.filter(report => {
        const s = report.display_status || report.status || '';

        // Status tab filter
        if (currentStatus) {
          if (currentStatus === 'Pending' && !['Pending', 'Pending Approval'].includes(s)) return false;
          if (currentStatus === 'In Progress' && !['In Progress', 'Processing'].includes(s)) return false;
          if (currentStatus === 'Completed' && !['Completed', 'Resolved', 'Closed'].includes(s)) return false;
          if (currentStatus === 'Rejected' && !['Rejected', 'Cancelled'].includes(s)) return false;
        }

        // Priority filter
        if (priorityValue && report.priority !== priorityValue) {
          return false;
        }

        // Search filter
        if (searchTerm) {
          const reportId = String(report.report_id || '').toLowerCase();
          const equipment = getFieldValue(report, ['equipment_name', 'equipment', 'asset_name', 'asset']).toLowerCase();
          const room = getFieldValue(report, ['room_name', 'room', 'classroom']).toLowerCase();
          const desc = String(report.description || '').toLowerCase();

          if (!reportId.includes(searchTerm) && 
              !equipment.includes(searchTerm) && 
              !room.includes(searchTerm) &&
              !desc.includes(searchTerm)) {
            return false;
          }
        }

        return true;
      });

      // Apply sorting
      const priorityOrder = { 'Critical': 4, 'High': 3, 'Medium': 2, 'Low': 1 };
      filteredReports.sort((a, b) => {
        if (sortValue === 'oldest') {
          return new Date(a.reported_at || 0) - new Date(b.reported_at || 0);
        } else if (sortValue === 'priority') {
          return (priorityOrder[b.priority] || 0) - (priorityOrder[a.priority] || 0);
        } else {
          // default: newest first
          return new Date(b.reported_at || 0) - new Date(a.reported_at || 0);
        }
      });

      currentPage = 1;
      renderTable();
    }

    function cleanLabel(val) {
      if (!val) return '';
      return String(val)
        .replace(/^(meeting_room|router|devices|ac_unit|videocam|tv|volume_up|mic|cable|photo_camera|computer)\s+/gi, '')
        .trim();
    }

    // 6. Render table
    function renderTable() {
      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const pageItems = filteredReports.slice(start, end);

      if (filteredReports.length === 0) {
        tbody.innerHTML = '';
        emptyState.classList.remove('hidden');
        paginationInfo.textContent = 'Showing 0 entries';
        paginationNav.innerHTML = '';
        return;
      }
      emptyState.classList.add('hidden');

      // Render rows
      tbody.innerHTML = pageItems.map((r, index) => {
        const rawEquipment = getFieldValue(r, ['equipment_name', 'equipment', 'asset_name', 'asset']);
        const rawRoom = getFieldValue(r, ['room_name', 'room', 'classroom']);
        const equipment = cleanLabel(rawEquipment);
        const room = cleanLabel(rawRoom);
        const rowClass = index % 2 === 0 ? 'bg-white' : 'bg-[#EAF5FF]';
        
        const currentStatus = r.display_status || r.status || '';
        const isPending = ['Pending', 'Pending Approval'].includes(r.status) && ['Pending', 'Pending Approval'].includes(currentStatus);
        
        return `
          <tr class="${rowClass} hover:bg-[#D6EBFF] transition-colors border-b border-outline-variant/10 cursor-pointer"
              onclick="location.href='ReportDetails.html?id=${r.report_id}'">
            <td class="py-4 px-6 text-body-md">${start + index + 1}</td>
            <td class="py-4 px-6 font-bold text-brand-blue">${UiHelpers.formatReportId(r.report_id)}</td>
            <td class="py-4 px-6 text-body-md">${equipment}</td>
            <td class="py-4 px-6 text-body-md">${room}</td>
            <td class="py-4 px-6">${priorityBadge(r.priority)}</td>
            <td class="py-4 px-6 text-body-md">${formatDate(r.reported_at)}</td>
            <td class="py-4 px-6">${statusBadge(currentStatus)}</td>
            <td class="py-4 px-6 text-center">
              <div class="flex items-center justify-center gap-1">
                <button class="text-brand-blue hover:text-primary-container p-1 rounded-full hover:bg-primary-fixed transition-all" 
                        title="View Details"
                        onclick="event.stopPropagation(); location.href='ReportDetails.html?id=${r.report_id}'">
                  <span class="material-symbols-outlined">visibility</span>
                </button>
                ${isPending ? `
                <button class="text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-50 transition-all" 
                        title="Delete Report"
                        onclick="event.stopPropagation(); deletePendingReport('${r.report_id}')">
                  <span class="material-symbols-outlined text-sm">delete</span>
                </button>
                ` : ''}
              </div>
            </td>
          </tr>
        `;
      }).join('');

      // Update pagination
      const totalPages = Math.ceil(filteredReports.length / itemsPerPage);
      paginationInfo.textContent = `Showing ${start + 1} to ${Math.min(end, filteredReports.length)} of ${filteredReports.length} entries`;

      // Render pagination buttons
      let paginationHTML = '';
      
      // Previous button
      paginationHTML += `
        <button class="w-10 h-10 flex items-center justify-center rounded hover:bg-secondary-container transition-colors disabled:opacity-30" 
                onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>
          <span class="material-symbols-outlined text-body-md">chevron_left</span>
        </button>
      `;

      // Page numbers
      for (let i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
          paginationHTML += `
            <button class="w-10 h-10 rounded bg-brand-blue text-white font-label-lg" onclick="goToPage(${i})">${i}</button>
          `;
        } else if (i <= 3 || i > totalPages - 2 || (i >= currentPage - 1 && i <= currentPage + 1)) {
          paginationHTML += `
            <button class="w-10 h-10 rounded hover:bg-secondary-container text-on-surface transition-colors font-label-lg" onclick="goToPage(${i})">${i}</button>
          `;
        } else if (i === 4 && currentPage > 5) {
          paginationHTML += `<span class="px-2 text-on-surface-variant">...</span>`;
        } else if (i === totalPages - 3 && currentPage < totalPages - 4) {
          paginationHTML += `<span class="px-2 text-on-surface-variant">...</span>`;
        }
      }

      // Next button
      paginationHTML += `
        <button class="w-10 h-10 flex items-center justify-center rounded hover:bg-secondary-container transition-colors disabled:opacity-30" 
                onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>
          <span class="material-symbols-outlined text-body-md">chevron_right</span>
        </button>
      `;

      paginationNav.innerHTML = paginationHTML;
    }

    // 7. Pagination function
    window.goToPage = function(page) {
      const totalPages = Math.ceil(filteredReports.length / itemsPerPage);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderTable();
    };

    // 8. Event listeners
    // Status tab click handlers
    statusTabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        currentStatus = btn.dataset.status || '';

        // Update tab styles
        statusTabBtns.forEach(b => {
          const isSelected = (b.dataset.status || '') === currentStatus;
          const badge = b.querySelector('span');

          if (isSelected) {
            b.className = 'status-tab-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm bg-brand-blue text-white cursor-pointer';
            if (badge) badge.className = 'ml-1 text-xs px-2 py-0.5 rounded-full bg-white/20 font-bold';
          } else {
            b.className = 'status-tab-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white text-on-surface-variant hover:bg-surface-container-high border border-outline-variant/30 cursor-pointer';
            if (badge) {
              const statusVal = b.dataset.status || '';
              let badgeColor = 'bg-gray-100 text-gray-800';
              if (statusVal === 'Pending') badgeColor = 'bg-amber-100 text-amber-800';
              else if (statusVal === 'In Progress') badgeColor = 'bg-blue-100 text-blue-800';
              else if (statusVal === 'Completed') badgeColor = 'bg-green-100 text-green-800';
              else if (statusVal === 'Rejected') badgeColor = 'bg-red-100 text-red-800';
              badge.className = `ml-1 text-xs px-2 py-0.5 rounded-full ${badgeColor} font-bold`;
            }
          }
        });

        applyFilters();
      });
    });

    if (searchInput) {
      searchInput.addEventListener('input', () => {
        if (clearSearchBtn) {
          if (searchInput.value.trim().length > 0) {
            clearSearchBtn.classList.remove('hidden');
          } else {
            clearSearchBtn.classList.add('hidden');
          }
        }
        applyFilters();
      });
    }

    if (clearSearchBtn && searchInput) {
      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.classList.add('hidden');
        applyFilters();
      });
    }

    if (priorityFilter) {
      priorityFilter.addEventListener('change', applyFilters);
    }

    if (sortBySelect) {
      sortBySelect.addEventListener('change', applyFilters);
    }

    window.deletePendingReport = async function(id) {
      const targetReport = allReports.find(r => String(r.report_id) === String(id) || String(r.report_id).replace(/\D/g, '') === String(id).replace(/\D/g, ''));
      const statusCheck = targetReport ? (targetReport.display_status || targetReport.status) : '';
      if (statusCheck && !['Pending', 'Pending Approval'].includes(statusCheck)) {
        alert('Only reports in Pending status can be deleted.');
        return;
      }
      if (!confirm('Are you sure you want to delete report #' + id + '? This action cannot be undone.')) {
        return;
      }
      try {
        if (window.Api && window.Auth && Auth.isAuthenticated()) {
          try {
            await Api.delete('/fault-reports/' + id);
          } catch (e) {}
        }
        
        // Remove from local storage if stored locally
        try {
          let userReports = JSON.parse(localStorage.getItem('vnu_user_reports') || '[]');
          userReports = userReports.filter(r => String(r.report_id) !== String(id));
          localStorage.setItem('vnu_user_reports', JSON.stringify(userReports));
        } catch (e) {}

        // Store in deleted reports list so seed/mock and cached reports stay deleted
        try {
          let deletedReports = JSON.parse(localStorage.getItem('vnu_deleted_reports') || '[]');
          const formattedId = window.UiHelpers ? UiHelpers.formatReportId(id) : String(id);
          const rawId = String(id).replace(/\D/g, '');
          if (!deletedReports.includes(formattedId)) deletedReports.push(formattedId);
          if (rawId && !deletedReports.includes(rawId)) deletedReports.push(rawId);
          if (!deletedReports.includes(String(id))) deletedReports.push(String(id));
          localStorage.setItem('vnu_deleted_reports', JSON.stringify(deletedReports));
        } catch (e) {}

        if (window.showToast) {
          showToast(`Report #${id} deleted successfully.`, 'success');
        }
        loadReports();
      } catch (err) {
        if (window.showToast) {
          showToast('Failed to delete report: ' + (err.message || err), 'error');
        } else {
          alert('Failed to delete report: ' + (err.message || err));
        }
      }
    };

    // Check pending toast message
    const pendingToast = sessionStorage.getItem('vnu_toast_msg');
    if (pendingToast) {
      const type = sessionStorage.getItem('vnu_toast_type') || 'success';
      sessionStorage.removeItem('vnu_toast_msg');
      sessionStorage.removeItem('vnu_toast_type');
      if (window.showToast) {
        showToast(pendingToast, type);
      }
    }

    // 9. Load data
    loadReports().catch(err => console.error('Failed to load reports', err));

  })();
</script>
</body>
</html>
