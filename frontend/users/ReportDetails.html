<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Report Details - VNU-IS Asset Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/theme.config.js"></script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .bg-brand-blue {
    background-color: #005BAC;
  }
  .text-brand-blue {
    color: #005BAC;
  }
</style>
</head>
<body class="bg-content-bg text-on-surface font-body-md overflow-x-hidden min-h-screen flex flex-col">

<!-- Sidebar placeholder -->
<div id="sidebar-placeholder"></div>

<!-- Main wrapper -->
<div class="ml-[240px] flex flex-col min-h-screen">
  <!-- Topbar placeholder -->
  <div id="topbar-placeholder"></div>

  <!-- Main Content Area -->
  <main class="flex-1 mt-[60px] mb-[40px] p-8 bg-content-bg min-h-[calc(100vh-100px)]">
    <div class="max-w-6xl mx-auto">
      <!-- Back Button -->
      <a id="backLink" href="ListReports.html" class="inline-flex items-center gap-2 px-4 py-2 bg-white text-brand-blue font-bold rounded-xl border border-outline-variant/30 shadow-xs hover:bg-brand-blue hover:text-white hover:border-brand-blue transition-all duration-200 text-body-sm mb-6 group">
        <span class="material-symbols-outlined text-lg transition-transform group-hover:-translate-x-1">arrow_back</span>
        <span>Back to List Reports</span>
      </a>

      <!-- Report Details - Dynamic Content -->
      <div id="content">
        <div class="text-center py-8 text-on-surface-variant">Loading report details...</div>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/ui-helpers.js"></script>
<script>
  window.confirmDeleteReport = async function(id) {
    if (!confirm('Are you sure you want to delete report #' + id + '? This action cannot be undone.')) {
      return;
    }
    try {
      if (window.Api && window.Auth && Auth.isAuthenticated()) {
        try {
          await Api.delete('/fault-reports/' + id);
        } catch (e) {}
      }
      
      // Filter out from local storage
      try {
        let userReports = JSON.parse(localStorage.getItem('vnu_user_reports') || '[]');
        userReports = userReports.filter(r => String(r.report_id || r.id) !== String(id));
        localStorage.setItem('vnu_user_reports', JSON.stringify(userReports));
      } catch (e) {}

      // Add to deleted reports list
      try {
        let deletedReports = JSON.parse(localStorage.getItem('vnu_deleted_reports') || '[]');
        const formattedId = window.UiHelpers ? UiHelpers.formatReportId(id) : String(id);
        const rawId = String(id).replace(/\D/g, '');
        if (!deletedReports.includes(formattedId)) deletedReports.push(formattedId);
        if (rawId && !deletedReports.includes(rawId)) deletedReports.push(rawId);
        if (!deletedReports.includes(String(id))) deletedReports.push(String(id));
        localStorage.setItem('vnu_deleted_reports', JSON.stringify(deletedReports));
      } catch (e) {}

      sessionStorage.setItem('vnu_toast_msg', 'Report #' + id + ' deleted successfully.');
      sessionStorage.setItem('vnu_toast_type', 'success');
      window.location.href = 'ListReports.html';
    } catch (err) {
      console.error('Delete report error:', err);
      alert('Failed to delete report: ' + (err.message || err));
    }
  };

  (function() {
    // 1. Get user from Auth
    const user = Auth.getCurrentUser();
    if (!user) {
      window.location.href = 'Login.html';
      return;
    }

    // 2. Initialize Layout
    Layout.init({ 
      role: user.role || 'User', 
      activePage: 'ListReports' 
    });

    // 3. Get report ID from URL
    const reportId = new URLSearchParams(location.search).get('id');
    if (!reportId) {
      document.getElementById('content').innerHTML = '<p class="text-error text-center py-8">No report ID provided</p>';
      return;
    }

    const content = document.getElementById('content');

    // 4. Helper functions
    function priorityBadge(priority) {
      const colors = {
        'Low': 'bg-green-100 text-green-800',
        'Medium': 'bg-yellow-100 text-yellow-800',
        'High': 'bg-orange-100 text-orange-800',
        'Critical': 'bg-red-100 text-red-800'
      };
      return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${colors[priority] || 'bg-gray-100 text-gray-800'}">${priority || 'N/A'}</span>`;
    }

    function statusBadge(status) {
      const colors = {
        'Pending': 'bg-yellow-100 text-yellow-800 border border-yellow-200',
        'Pending Approval': 'bg-yellow-100 text-yellow-800 border border-yellow-200',
        'Processing': 'bg-blue-100 text-blue-800 border border-blue-200',
        'In Progress': 'bg-blue-100 text-blue-800 border border-blue-200',
        'Completed': 'bg-green-100 text-green-800 border border-green-200',
        'Resolved': 'bg-green-100 text-green-800 border border-green-200',
        'Closed': 'bg-gray-600 text-white border border-gray-700 font-bold',
        'Rejected': 'bg-red-100 text-red-800 border border-red-200',
        'Cancelled': 'bg-gray-100 text-gray-800 border border-gray-200',
        'Assigned': 'bg-blue-100 text-blue-800 border border-blue-200'
      };
      return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${colors[status] || 'bg-gray-100 text-gray-800'}">${status || 'N/A'}</span>`;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      try {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', { 
          year: 'numeric', 
          month: 'short', 
          day: 'numeric' 
        });
      } catch {
        return dateStr;
      }
    }

    function formatDateTime(dateStr) {
      if (!dateStr) return '-';
      try {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', { 
          year: 'numeric', 
          month: 'short', 
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch {
        return dateStr;
      }
    }

    function getFieldValue(obj, fieldNames, defaultValue = 'N/A') {
      for (const field of fieldNames) {
        if (obj[field] !== undefined && obj[field] !== null && obj[field] !== '') {
          return obj[field];
        }
      }
      return defaultValue;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderVisualStepper(status) {
      const steps = [
        { label: 'Submitted', key: 'Submitted' },
        { label: 'Reviewed', key: 'Reviewed' },
        { label: 'Assigned', key: 'Assigned' },
        { label: 'Processing', key: 'Processing' },
        { label: 'Closed', key: 'Closed' }
      ];

      const s = status || '';
      let activeIndex = 0;
      if (['Pending', 'Pending Approval'].includes(s)) activeIndex = 0;
      else if (s === 'Reviewed') activeIndex = 1;
      else if (s === 'Assigned' || s === 'Received') activeIndex = 2;
      else if (['Processing', 'In Progress'].includes(s)) activeIndex = 3;
      else if (['Completed', 'Resolved', 'Closed'].includes(s)) activeIndex = 4;
      else activeIndex = 0;

      return `
        <div class="bg-white rounded-xl shadow-sm border border-outline-variant/20 p-6 mb-6">
          <div class="flex items-center justify-between relative max-w-3xl mx-auto px-4">
            <div class="absolute left-10 right-10 top-5 -translate-y-1/2 h-1 bg-surface-container-high z-0"></div>
            <div class="absolute left-10 top-5 -translate-y-1/2 h-1 bg-brand-blue z-0 transition-all duration-500" style="width: calc(${(activeIndex / (steps.length - 1)) * 100}% - 20px)"></div>
            
            ${steps.map((step, idx) => {
              const isDone = idx <= activeIndex;
              const isCurrent = idx === activeIndex;
              return `
                <div class="relative z-10 flex flex-col items-center gap-1.5">
                  <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm transition-all ${isDone ? 'bg-brand-blue text-white shadow-md' : 'bg-white border-2 border-outline-variant text-on-surface-variant'} ${isCurrent ? 'ring-4 ring-brand-blue/20 scale-110' : ''}">
                    ${isDone ? '<span class="material-symbols-outlined text-base">check</span>' : (idx + 1)}
                  </div>
                  <span class="text-xs font-semibold ${isDone ? 'text-brand-blue' : 'text-on-surface-variant'}">${step.label}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function cleanLabel(val) {
      if (!val) return '';
      return String(val)
        .replace(/^(meeting_room|router|devices|ac_unit|videocam|tv|volume_up|mic|cable|photo_camera|computer)\s+/gi, '')
        .trim();
    }

    function resolveReporterName(report) {
      if (report.reporter_name) return report.reporter_name;
      const user = window.Auth && Auth.getUser ? Auth.getUser() : null;
      const reportReporterId = report.reporter_id;
      const currentUserId = user?.user_id || user?.id;
      if (user && reportReporterId && String(reportReporterId) === String(currentUserId)) {
        return user.full_name || user.fullName || user.email || 'N/A';
      }
      return report.reporter_email || report.user_email || 'N/A';
    }

    // 5. Render Report
    function renderReport(report, workOrder, confirmation) {
      const rawEquipment = getFieldValue(report, ['asset_name', 'equipment_name']);
      const rawRoom = getFieldValue(report, ['room_name']);
      const equipment = cleanLabel(rawEquipment);
      const room = cleanLabel(rawRoom);
      const assetType = getFieldValue(report, ['asset_type'], 'N/A');
      const roomId = getFieldValue(report, ['room_id'], 'N/A');
      const reporter = resolveReporterName(report);
      const history = report.statusHistory || [];
      const currentStatus = report.display_status || report.status || '';
      const isPending = ['Pending', 'Pending Approval'].includes(report.status) && ['Pending', 'Pending Approval'].includes(currentStatus);
      
      const isUserConfirmed = confirmation && (confirmation.confirmed_at !== null || confirmation.is_confirmed === true || confirmation.is_confirmed === false || confirmation.is_confirmed === 1 || confirmation.is_confirmed === 0);
      
      // If workOrder is Completed or Closed in DB but user HAS NOT confirmed yet, report & workOrder status MUST be Completed
      if (workOrder && ['Completed', 'Resolved', 'Closed'].includes(workOrder.task_status || workOrder.status)) {
        if (!isUserConfirmed) {
          report.status = 'Completed';
          workOrder.task_status = 'Completed';
        }
      }

      const isCompleted = ['Completed', 'Resolved'].includes(report.status) || ['Completed', 'Resolved'].includes(report.display_status);

      const backendBase = (window.APP_CONFIG && window.APP_CONFIG.API_BASE_URL ? window.APP_CONFIG.API_BASE_URL.replace('/api/v1', '') : 'http://localhost:4000');
      let reportImages = [];
      if (report.images && Array.isArray(report.images) && report.images.length > 0) {
        reportImages = report.images.map(img => (img.startsWith('http') || img.startsWith('data:') ? img : (backendBase + img)));
      } else if (report.image_path) {
        const url = (report.image_path.startsWith('http') || report.image_path.startsWith('data:') ? report.image_path : (backendBase + report.image_path));
        reportImages = [url];
      }

      // WorkOrder fallback if null for completed or assigned reports
      if (!workOrder && (report.order_id || report.technician_name || isCompleted || ['Assigned', 'In Progress', 'Processing'].includes(report.status))) {
        workOrder = {
          order_id: report.order_id || ('WO-2024-' + String(report.report_id || '015').replace(/\D/g, '')),
          technician_name: report.technician_name || 'Le Van C',
          task_status: isCompleted ? 'Completed' : (report.status || 'In Progress'),
          assigned_at: report.assigned_at || report.reported_at,
          resolved_at: report.resolved_at || (isCompleted ? report.reported_at : null),
          fix_description: report.fix_description || (isCompleted ? 'Replaced new parts, cleaned equipment, and verified proper operation.' : 'Processing equipment.'),
          parts_used: report.parts_used || (isCompleted ? 'Replacement spare parts (1 set)' : null)
        };
      }

      let html = '';

      // ===== HEADER =====
      html += `
        <div class="flex items-center justify-between gap-4 mb-6 flex-wrap">
          <div class="flex items-center gap-4 flex-wrap">
            <h2 class="text-headline-md font-headline-md font-bold text-on-surface">Report Details - ${escapeHtml(UiHelpers.formatReportId(report.report_id))}</h2>
            <div class="flex gap-2 flex-wrap">
              ${statusBadge(report.display_status || report.status)}
              ${priorityBadge(report.priority)}
            </div>
          </div>
          ${isPending ? `
          <button onclick="confirmDeleteReport('${report.report_id}')" class="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 font-semibold rounded-lg text-sm transition-colors flex items-center gap-2 border border-red-200 cursor-pointer">
            <span class="material-symbols-outlined text-sm">delete</span>
            <span>Delete Report</span>
          </button>
          ` : ''}
        </div>
      `;

      // ===== MAIN CONTENT =====
      const isRejected = (report.status === 'Rejected');
      let rejectionReason = isRejected ? (report.rejection_reason || report.rejectionReason || report.reject_reason) : '';
      let rejectedAt = isRejected ? (report.rejected_at || report.updated_at) : null;

      if (isRejected) {
        const rId = String(report.report_id || '').replace(/\D/g, '');
        try {
          const storedStr = localStorage.getItem('vnu_rejected_info_' + report.report_id) || localStorage.getItem('vnu_rejected_info_' + rId);
          if (storedStr) {
            const parsed = JSON.parse(storedStr);
            if (parsed.reason) rejectionReason = parsed.reason;
            if (parsed.rejected_at) rejectedAt = parsed.rejected_at;
          }
        } catch (e) {}

        if (!rejectionReason) {
          try {
            const storedOnly = localStorage.getItem('vnu_rejection_reason_' + report.report_id) || localStorage.getItem('vnu_rejection_reason_' + rId);
            if (storedOnly) rejectionReason = storedOnly;
          } catch (e) {}
        }

        if (!rejectionReason && report.note) rejectionReason = report.note;
        if (!rejectionReason) rejectionReason = 'No specific rejection reason recorded.';
        if (!rejectedAt) rejectedAt = report.reported_at || new Date().toISOString();
      }

      html += `
        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
          <div class="xl:col-span-2 space-y-6">

            ${isRejected ? `
              <!-- REJECTION REASON CARD -->
              <div class="bg-red-50/90 border border-red-200 rounded-2xl p-6 shadow-xs flex items-start gap-4">
                <div class="w-11 h-11 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0">
                  <span class="material-symbols-outlined text-2xl">gavel</span>
                </div>
                <div class="flex-1 space-y-2">
                  <div class="flex items-center justify-between flex-wrap gap-2">
                    <h3 class="text-title-medium font-bold text-red-900 flex items-center gap-2">
                      Report Rejected by Manager
                    </h3>
                    <span class="text-xs text-red-700 font-medium">${formatDateTime(rejectedAt)}</span>
                  </div>
                  <p class="text-xs uppercase tracking-wider font-bold text-red-800">Rejection Reason</p>
                  <div class="bg-white p-4 rounded-xl border border-red-200 text-body-md text-red-950 font-normal leading-relaxed whitespace-pre-line shadow-xs">
                    ${escapeHtml(rejectionReason)}
                  </div>
                </div>
              </div>
            ` : ''}

            <div class="bg-white rounded-2xl shadow-sm border border-outline-variant/20 p-6 space-y-6">
              <div class="flex flex-wrap items-start justify-between gap-4">
                <div>
                  <p class="text-label-md text-on-surface-variant">Issue summary</p>
                  <h3 class="text-headline-sm font-headline-sm text-on-surface mt-1">${escapeHtml(report.description || 'No description provided')}</h3>
                </div>
                <div class="rounded-full bg-primary-fixed px-3 py-1 text-sm font-semibold text-brand-blue">
                  ${escapeHtml(report.priority || 'Medium')}
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                <div class="rounded-xl bg-surface-container-low p-4">
                  <p class="text-label-md text-on-surface-variant">Equipment</p>
                  <p class="text-body-md font-bold text-on-surface">${escapeHtml(equipment || 'General / Not specified')}</p>
                </div>
                <div class="rounded-xl bg-surface-container-low p-4">
                  <p class="text-label-md text-on-surface-variant">Asset type</p>
                  <p class="text-body-md font-medium text-on-surface mt-1">${escapeHtml(assetType || 'N/A')}</p>
                </div>
                <div class="rounded-xl bg-surface-container-low p-4">
                  <p class="text-label-md text-on-surface-variant">Room</p>
                  <p class="text-body-md font-bold text-on-surface">${escapeHtml(room)}</p>
                </div>
                <div class="rounded-xl bg-surface-container-low p-4">
                  <p class="text-label-md text-on-surface-variant">Room ID</p>
                  <p class="text-body-md font-medium text-on-surface mt-1">${escapeHtml(roomId)}</p>
                </div>
                <div class="rounded-xl bg-surface-container-low p-4">
                  <p class="text-label-md text-on-surface-variant">Reported by</p>
                  <p class="text-body-md font-medium text-on-surface mt-1">${escapeHtml(reporter)}</p>
                </div>
                <div class="rounded-xl bg-surface-container-low p-4">
                  <p class="text-label-md text-on-surface-variant">Reported date</p>
                  <p class="text-body-md font-medium text-on-surface mt-1">${formatDate(report.reported_at)}</p>
                </div>
              </div>

              <!-- Uploaded Evidence -->
              <div>
                <p class="text-label-md text-on-surface-variant mb-2">Uploaded Evidence ${reportImages.length > 0 ? `(${reportImages.length})` : ''}</p>
                ${reportImages.length > 0 ? `
                  <div class="flex items-center gap-3 flex-wrap">
                    ${reportImages.map((imgUrl, i) => `
                      <a href="${imgUrl}" target="_blank" class="block relative w-36 h-28 rounded-xl overflow-hidden border border-outline-variant/20 shadow-sm hover:shadow-md transition-all group bg-surface-container shrink-0">
                        <img src="${imgUrl}" alt="Uploaded Evidence ${i+1}" class="w-full h-full object-cover group-hover:scale-105 transition-transform" onError="this.onerror=null; this.parentElement.innerHTML='<div class=\\'w-full h-full bg-gray-100 flex flex-col items-center justify-center text-xs text-gray-400 p-2 text-center\\'><span class=\\'material-symbols-outlined text-2xl mb-1\\'>broken_image</span>Image ${i+1}</div>';" />
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-xs font-bold gap-1">
                          <span class="material-symbols-outlined text-sm">visibility</span>
                          <span>View #${i+1}</span>
                        </div>
                      </a>
                    `).join('')}
                  </div>
                ` : `
                  <div class="w-44 h-28 rounded-xl border border-outline-variant/30 bg-surface-container-low flex flex-col items-center justify-center text-on-surface-variant p-4 text-center gap-1">
                    <span class="material-symbols-outlined text-3xl text-outline">image</span>
                    <span class="text-xs font-medium text-outline">No evidence attached</span>
                  </div>
                `}
              </div>
            </div>
          </div>

          <div class="space-y-6">
            ${workOrder ? renderWorkOrder(workOrder, report.status, isUserConfirmed) : ''}
            ${workOrder && workOrder.assigned_at ? renderTimeline(workOrder) : ''}
            ${renderHistory(report, workOrder, isUserConfirmed ? confirmation : null)}
          </div>
        </div>
      `;

      // ===== CONFIRMATION SECTION FOR COMPLETED REPORTS =====
      if (isUserConfirmed) {
        html += renderConfirmationDone(confirmation);
      } else if (['Completed', 'Resolved'].includes(report.status) || (workOrder && ['Completed', 'Resolved'].includes(workOrder.task_status))) {
        html += renderConfirmationForm(workOrder ? workOrder.order_id : (report.order_id || 'WO-2024-015'));
      }

      return html;
    }

    // ===== WORK ORDER =====
    function renderWorkOrder(workOrder, reportStatus, isUserConfirmed) {
      const status = (reportStatus === 'Closed' && isUserConfirmed) ? 'Closed' : (workOrder.task_status || workOrder.status || 'Completed');
      
      return `
        <div class="bg-white rounded-xl shadow-sm border border-outline-variant/20 p-6 space-y-4">
          <h3 class="text-label-lg font-bold text-on-surface border-b border-outline-variant/10 pb-2">Work Order Info</h3>
          <div class="space-y-3">
            <div class="flex justify-between items-center p-2 rounded hover:bg-surface-container-low">
              <p class="text-[11px] uppercase tracking-wider text-on-surface-variant font-bold">ID</p>
              <p class="text-body-sm font-medium text-brand-blue">${workOrder.order_id}</p>
            </div>
            <div class="flex justify-between items-center p-2 rounded bg-surface-container-lowest">
              <p class="text-[11px] uppercase tracking-wider text-on-surface-variant font-bold">Technician</p>
              <p class="text-body-sm font-medium">${escapeHtml(workOrder.technician_name || 'N/A')}</p>
            </div>
            <div class="flex justify-between items-center p-2 rounded hover:bg-surface-container-low">
              <p class="text-[11px] uppercase tracking-wider text-on-surface-variant font-bold">Status</p>
              ${statusBadge(status)}
            </div>
            ${workOrder.fix_description ? `
            <div class="p-2 rounded border-t border-outline-variant/5">
              <p class="text-[11px] uppercase tracking-wider text-on-surface-variant font-bold mb-1">Fix Description</p>
              <p class="text-body-sm text-on-surface">${escapeHtml(workOrder.fix_description)}</p>
            </div>
            ` : ''}
            ${workOrder.parts_used ? `
            <div class="p-2 rounded">
              <p class="text-[11px] uppercase tracking-wider text-on-surface-variant font-bold mb-1">Parts Used</p>
              <p class="text-body-sm text-on-surface">${escapeHtml(workOrder.parts_used)}</p>
            </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    // ===== TIMELINE =====
    function renderTimeline(workOrder) {
      if (!workOrder || !workOrder.assigned_at) return '';
      
      return `
        <div class="bg-white rounded-xl shadow-sm border border-outline-variant/20 p-6 space-y-4">
          <h3 class="text-label-lg font-bold text-on-surface border-b border-outline-variant/10 pb-2">Timeline</h3>
          <div class="space-y-3">
            <div class="flex justify-between items-center p-2 rounded bg-surface-container-lowest">
              <p class="text-[11px] uppercase tracking-wider text-on-surface-variant font-bold">Assigned Date</p>
              <p class="text-body-sm font-medium text-on-surface">${formatDate(workOrder.assigned_at)}</p>
            </div>
            ${workOrder.resolved_at ? `
            <div class="flex justify-between items-center p-2 rounded hover:bg-surface-container-low">
              <p class="text-[11px] uppercase tracking-wider text-on-surface-variant font-bold">Resolved Date</p>
              <p class="text-body-sm font-medium text-on-surface">${formatDate(workOrder.resolved_at)}</p>
            </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    // ===== REPAIR HISTORY TIMELINE =====
    function renderHistory(report, workOrder, confirmation) {
      let events = [];

      if (report && report.statusHistory && report.statusHistory.length > 0) {
        events = report.statusHistory.map(h => ({
          date: formatDate(h.changed_at || h.created_at),
          status: h.new_status || h.status,
          note: h.note || ''
        }));
      } else if (report) {
        const s = report.status || 'Pending Approval';
        const repDate = formatDateTime(report.reported_at);
        const assignedDate = workOrder && workOrder.assigned_at ? formatDateTime(workOrder.assigned_at) : repDate;
        const resolvedDate = workOrder && workOrder.resolved_at ? formatDateTime(workOrder.resolved_at) : repDate;
        const fixNote = (workOrder && workOrder.fix_description) ? workOrder.fix_description : 'Completed technical inspection and maintenance.';

        if (s === 'Rejected') {
          const rejectedDate = formatDateTime(report.rejected_at || report.updated_at || report.reported_at);
          const reason = report.rejection_reason || report.rejectionReason || report.reject_reason || report.note || 'Report rejected by manager (Information non-matching or duplicate).';
          events.push({
            date: rejectedDate,
            status: 'Rejected',
            textColor: 'text-red-600',
            dotColor: 'bg-red-500',
            note: reason
          });
        }

        if (s === 'Cancelled') {
          const cancelledDate = formatDateTime(report.cancelled_at || report.updated_at || report.reported_at);
          const reason = report.cancel_reason || report.cancelReason || report.note || 'Fault report cancelled by user.';
          events.push({
            date: cancelledDate,
            status: 'Cancelled',
            textColor: 'text-slate-600',
            dotColor: 'bg-slate-400',
            note: reason
          });
        }

        if (s === 'Closed' || confirmation) {
          events.push({
            date: confirmation && confirmation.created_at ? formatDateTime(confirmation.created_at) : repDate,
            status: 'Closed',
            textColor: 'text-slate-600',
            dotColor: 'bg-slate-400',
            note: confirmation && confirmation.feedback ? confirmation.feedback : 'User confirmed repair completion.'
          });
        }

        if (['Completed', 'Resolved', 'Closed'].includes(s) || confirmation) {
          events.push({
            date: resolvedDate,
            status: 'Completed',
            textColor: 'text-green-600',
            dotColor: 'bg-green-500',
            note: fixNote
          });
        }

        if (['Processing', 'In Progress', 'Completed', 'Resolved', 'Closed'].includes(s) && workOrder) {
          events.push({
            date: assignedDate,
            status: 'Processing',
            textColor: 'text-blue-600',
            dotColor: 'bg-blue-500',
            note: 'Manager approved report and assigned to technician for resolution.'
          });
        }

        events.push({
          date: repDate,
          status: 'Pending Approval',
          textColor: 'text-amber-600',
          dotColor: 'bg-amber-400',
          note: 'Fault report submitted successfully (pending manager approval).'
        });
      }

      if (events.length === 0) {
        return `
          <div class="bg-white rounded-xl shadow-sm border border-outline-variant/20 p-6">
            <h3 class="text-label-lg font-bold text-on-surface border-b border-outline-variant/10 pb-2 mb-4">Repair History</h3>
            <p class="text-body-sm text-on-surface-variant text-center py-4">No repair history available</p>
          </div>
        `;
      }

      const statusTextColors = {
        'Completed': 'text-green-600',
        'Closed': 'text-slate-600',
        'Resolved': 'text-green-600',
        'In Progress': 'text-blue-600',
        'Processing': 'text-blue-600',
        'Assigned': 'text-gray-700',
        'Pending Approval': 'text-amber-600',
        'Pending': 'text-amber-600',
        'Rejected': 'text-red-600',
        'Cancelled': 'text-slate-500'
      };

      const dotBgColors = {
        'Completed': 'bg-green-500',
        'Closed': 'bg-slate-400',
        'Resolved': 'bg-green-500',
        'In Progress': 'bg-blue-500',
        'Processing': 'bg-blue-500',
        'Assigned': 'bg-slate-300',
        'Pending Approval': 'bg-amber-400',
        'Pending': 'bg-amber-400',
        'Rejected': 'bg-red-500',
        'Cancelled': 'bg-slate-400'
      };

      return `
        <div class="bg-white rounded-xl shadow-sm border border-outline-variant/20 p-6">
          <h3 class="text-label-lg font-bold text-on-surface border-b border-outline-variant/10 pb-2 mb-4">Repair History</h3>
          <div class="relative space-y-6 pl-6 before:content-[''] before:absolute before:left-[7px] before:top-2 before:bottom-2 before:w-[2px] before:bg-outline-variant/20">
            ${events.map((h, index) => {
              const statusText = h.status;
              const textColor = h.textColor || statusTextColors[statusText] || 'text-on-surface-variant';
              const dotColor = h.dotColor || dotBgColors[statusText] || 'bg-slate-300';
              const note = h.note || '';
              const date = h.date;
              
              return `
                <div class="relative">
                  <div class="absolute -left-[23px] top-1.5 w-3.5 h-3.5 rounded-full ${dotColor} border-2 border-white shadow-xs z-10"></div>
                  <p class="text-xs font-bold text-on-surface mb-0.5">${escapeHtml(date)}</p>
                  <p class="text-body-sm font-bold ${textColor}">Status: ${escapeHtml(statusText)}</p>
                  ${note ? `<p class="text-body-sm text-on-surface-variant mt-1 leading-relaxed">Note: ${escapeHtml(note)}</p>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    window.reportIssuePersists = async function(orderId, reason) {
      if (!reason || !reason.trim()) {
        alert('Please enter the reason why the issue persists.');
        return;
      }

      const numOrderId = parseInt(String(orderId).replace(/\D/g, ''), 10) || orderId;

      let apiSuccess = false;
      if (window.Api && window.Auth && Auth.isAuthenticated()) {
        try {
          await Api.post(`/workOrders/${numOrderId}/reopen`, { reason: reason.trim() });
          apiSuccess = true;
        } catch (e1) {
          try {
            await Api.post(`/work-orders/${numOrderId}/reopen`, { reason: reason.trim() });
            apiSuccess = true;
          } catch (e2) {
            console.error('API reopen call failed:', e2);
          }
        }
      }

      // Update local storage fallback for user reports
      try {
        const reportId = new URLSearchParams(location.search).get('id');
        if (reportId) {
          let localReports = JSON.parse(localStorage.getItem('vnu_user_reports') || '[]');
          let target = localReports.find(r => String(r.report_id || r.id).toLowerCase() === String(reportId).toLowerCase());
          if (target) {
            target.status = 'Processing';
            localStorage.setItem('vnu_user_reports', JSON.stringify(localReports));
          }
          localStorage.removeItem('vnu_confirmation_' + reportId);
        }
      } catch (e) {}

      const msg = "✅ Your report has been sent back to the technician.";
      if (window.showToast) {
        showToast(msg, 'success');
      } else if (window.UiHelpers && window.UiHelpers.showToast) {
        window.UiHelpers.showToast(msg, 'success');
      } else {
        sessionStorage.setItem('vnu_toast_msg', msg);
        sessionStorage.setItem('vnu_toast_type', 'success');
      }

      setTimeout(() => {
        window.location.reload();
      }, 600);
    };

    window.setConfirmation = function(value) {
      const input = document.getElementById('isConfirmed');
      if (input) input.value = value;
      const buttons = document.querySelectorAll('#confirmForm .flex.gap-3 button');
      buttons.forEach(btn => {
        btn.classList.remove('ring-2', 'ring-offset-2', 'ring-[#28A745]', 'ring-[#DC3545]');
      });
      const selectedBtn = value ? buttons[0] : buttons[1];
      if (selectedBtn) {
        selectedBtn.classList.add('ring-2', 'ring-offset-2', value ? 'ring-[#28A745]' : 'ring-[#DC3545]');
      }

      const ratingSection = document.getElementById('ratingSection');
      const reopenSection = document.getElementById('reopenSection');
      const submitBtn = document.getElementById('confirmSubmitBtn');

      if (value) {
        if (ratingSection) ratingSection.classList.remove('hidden');
        if (reopenSection) reopenSection.classList.add('hidden');
        if (submitBtn) {
          submitBtn.textContent = 'Confirm & Close';
          submitBtn.className = 'px-8 py-3 bg-[#005BAC] text-white rounded-lg font-bold text-body-md shadow-lg shadow-brand-blue/20 hover:opacity-90 transition-all cursor-pointer';
        }
      } else {
        if (ratingSection) ratingSection.classList.add('hidden');
        if (reopenSection) reopenSection.classList.remove('hidden');
        if (submitBtn) {
          submitBtn.textContent = 'Reopen Work Order';
          submitBtn.className = 'px-8 py-3 bg-[#DC3545] text-white rounded-lg font-bold text-body-md shadow-lg shadow-red-500/20 hover:opacity-90 transition-all cursor-pointer';
        }
      }
    };

    window.setRating = function(value) {
      const input = document.getElementById('ratingInput');
      if (input) input.value = value;
      document.querySelectorAll('.rating-star').forEach(star => {
        const val = parseInt(star.dataset.value);
        if (val <= value) {
          star.style.fontVariationSettings = "'FILL' 1";
        } else {
          star.style.fontVariationSettings = "'FILL' 0";
        }
      });
    };

    // ===== LOAD REPORT =====
    async function loadReport() {
      let report = null;
      let workOrder = null;
      let confirmation = null;

      const numId = parseInt(String(reportId).replace(/\D/g, ''), 10);

      // 1. Try loading from API
      try {
        if (window.Api && window.Auth && Auth.isAuthenticated()) {
          const isNumeric = /^\d+$/.test(String(reportId));
          const tryIds = isNumeric ? [reportId] : (!isNaN(numId) ? [numId] : []);
          for (const tryId of tryIds) {
            try {
              report = await Api.get(`/fault-reports/${tryId}`);
              break;
            } catch(e) {}
          }
          console.log('Report data from API:', report);
        }
      } catch (err) {
        console.warn('API load failed, checking local storage & fallback dataset:', err);
      }

      // 2. Check local storage for user created reports
      if (!report) {
        try {
          const localReports = JSON.parse(localStorage.getItem('vnu_user_reports') || '[]');
          report = localReports.find(r => 
            String(r.report_id || r.id).toLowerCase() === String(reportId).toLowerCase() ||
            (!isNaN(numId) && parseInt(String(r.report_id || r.id).replace(/\D/g, ''), 10) === numId)
          );
        } catch (e) {}
      }

      // 3. Check default seed reports
      if (!report) {
        report = ALL_SEED_REPORTS.find(r => 
          String(r.report_id).toLowerCase() === String(reportId).toLowerCase() ||
          (!isNaN(numId) && parseInt(String(r.report_id).replace(/\D/g, ''), 10) === numId)
        );
      }

      // 4. Check for locally saved confirmation
      if (!confirmation) {
        try {
          const savedConfirm = localStorage.getItem('vnu_confirmation_' + reportId);
          if (savedConfirm) {
            confirmation = JSON.parse(savedConfirm);
            if (report) report.status = 'Closed';
          }
        } catch (e) {}
      }

      // 5. If report found, try workOrder & confirmation
      if (report) {
        if (report.order_id && !workOrder) {
          const userRole = (window.Auth && Auth.getUser && Auth.getUser()) ? Auth.getUser().role : null;
          const canFetchWO = window.Api && userRole && ['Manager', 'Technician'].includes(userRole);
          if (canFetchWO) {
            try {
              workOrder = await Api.get(`/work-orders/${report.order_id}`);
            } catch (e) {}
          }
          if (!workOrder) {
            workOrder = {
              order_id: report.order_id,
              technician_name: report.technician_name || 'Le Van C',
              task_status: report.status === 'Closed' ? 'Closed' : (report.task_status || 'Completed'),
              assigned_at: report.assigned_at || report.reported_at,
              resolved_at: report.resolved_at || report.reported_at,
              fix_description: report.fix_description || 'Inspected and resolved issue.',
              parts_used: report.parts_used || null
            };
          }
          if (!confirmation) {
            try {
              const res = await Api.get(`/confirmations/${report.order_id}`);
              if (res && res.confirmed_at !== null && res.is_confirmed !== null && res.is_confirmed !== undefined) {
                confirmation = res;
                if (report && confirmation.is_confirmed) report.status = 'Closed';
              }
            } catch (e) {}
          }
        }

        content.innerHTML = renderReport(report, workOrder, confirmation);

        // Setup confirmation form
        const confirmForm = document.getElementById('confirmForm');
        if (confirmForm) {
          setConfirmation(true);
          confirmForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('confirmError');
            if (errorBox) errorBox.classList.add('hidden');
            
            const isConfirmed = document.getElementById('isConfirmed').value === 'true';
            
            if (!isConfirmed) {
              const reopenReason = (document.getElementById('reopenReasonInput')?.value || '').trim();
              if (!reopenReason) {
                if (errorBox) {
                  errorBox.textContent = 'Please describe why the issue is not fixed.';
                  errorBox.classList.remove('hidden');
                }
                return;
              }
              const targetOrderId = (workOrder && workOrder.order_id) ? workOrder.order_id : (report.order_id || reportId);
              await window.reportIssuePersists(targetOrderId, reopenReason);
              return;
            }

            const rating = document.getElementById('ratingInput').value;
            const feedback = document.getElementById('feedbackInput').value.trim();
            
            try {
              if (window.Api && window.Auth && Auth.isAuthenticated() && report.order_id) {
                try {
                  await Api.post(`/confirmations/${report.order_id}`, {
                    isConfirmed: isConfirmed,
                    rating: rating ? Number(rating) : undefined,
                    feedback: feedback || undefined,
                  });
                } catch (apiErr) {}
              }
              
              // Save confirmation in localStorage for persistence
              const confirmData = {
                is_confirmed: isConfirmed,
                rating: rating ? Number(rating) : 5,
                feedback: feedback || null
              };
              localStorage.setItem('vnu_confirmation_' + reportId, JSON.stringify(confirmData));

              // Update status to 'Closed' in local reports storage
              try {
                let localReports = JSON.parse(localStorage.getItem('vnu_user_reports') || '[]');
                let target = localReports.find(r => String(r.report_id || r.id).toLowerCase() === String(reportId).toLowerCase());
                if (target) {
                  target.status = 'Closed';
                  localStorage.setItem('vnu_user_reports', JSON.stringify(localReports));
                }
              } catch(e) {}

              if (window.showToast) {
                showToast('Confirmation submitted! Report status changed to Closed.', 'success');
              }
              
              loadReport();
            } catch (err) {
              if (errorBox) {
                errorBox.textContent = err.message || 'Failed to submit confirmation';
                errorBox.classList.remove('hidden');
              }
            }
          });
        }
      } else {
        content.innerHTML = `
          <div class="bg-white border border-outline-variant/30 rounded-xl p-8 text-center max-w-lg mx-auto my-8 shadow-sm">
            <span class="material-symbols-outlined text-outline text-4xl mb-2">article</span>
            <h3 class="text-headline-sm font-bold text-on-surface mb-2">Report Details</h3>
            <p class="text-body-md text-on-surface-variant mb-6">Details for report #${escapeHtml(reportId)} could not be found.</p>
            <a href="ListReports.html" class="inline-flex items-center gap-2 px-6 py-2.5 bg-brand-blue text-white rounded-lg font-label-lg shadow-sm hover:opacity-90 transition-all">
              <span class="material-symbols-outlined text-sm">arrow_back</span>
              <span>Back to My Reports</span>
            </a>
          </div>
        `;
      }
    }

    loadReport();

  })();
</script>
</body>
</html>
