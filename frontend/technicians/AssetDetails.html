<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Details - VNU-IS Asset Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/theme.config.js"></script>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}</style>
</head>
<body class="bg-surface text-on-surface overflow-x-hidden">

<div id="sidebar-placeholder"></div>

<div class="ml-[240px] flex flex-col min-h-screen">
  <div id="topbar-placeholder"></div>

  <main class="flex-1 p-8 max-w-[640px]">
    <a href="AssetList.html" class="text-brand-blue text-label-md font-label-md flex items-center gap-1 mb-4 hover:underline">
      <span class="material-symbols-outlined text-[18px]">arrow_back</span> Back to Assets
    </a>
    <div id="content"></div>

    <div id="historyModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
      <div class="bg-white w-full max-w-2xl rounded-3xl overflow-hidden shadow-2xl">
        <div class="flex items-center justify-between px-6 py-4 border-b border-outline-variant/20">
          <div>
            <h2 id="historyModalTitle" class="text-headline-sm font-headline-sm text-on-surface">Repair History Details</h2>
            <p id="historyModalSubtitle" class="text-label-md text-on-surface-variant mt-1">View the full repair notes and status for this entry.</p>
          </div>
          <button onclick="closeHistoryModal()" class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div id="historyModalBody" class="p-6 text-body-sm text-on-surface"></div>
        <div class="px-6 py-4 border-t border-outline-variant/20 text-right">
          <button onclick="closeHistoryModal()" class="px-4 py-2 rounded-lg bg-surface-container-low hover:bg-surface-container-high transition-colors">Close</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/ui-helpers.js"></script>
<script>
  Auth.guard('Technician');
  Layout.init({ role: 'Technician', activePage: 'AssetList' });

  const assetId = new URLSearchParams(location.search).get('id');
  const content = document.getElementById('content');
  const STATUS_OPTIONS = ['Operational', 'Under Repair', 'Recommended for Replacement', 'Retired'];
  let currentHistoryItems = [];

  function render(a) {
    currentHistoryItems = Array.isArray(a.repairHistory) ? a.repairHistory : [];

    content.innerHTML = `
      <div class="bg-white rounded-xl shadow-sm border border-outline-variant/20 p-6">
        <div class="flex items-start justify-between">
          <div>
<<<<<<< HEAD
            <h1 class="text-headline-md font-headline-md text-primary">${UiHelpers.escapeHtml(a.asset_name || 'Unnamed Asset')}</h1>
            <p class="text-on-surface-variant text-body-sm mt-1">${UiHelpers.escapeHtml(a.asset_type || 'Unknown')} · ${UiHelpers.escapeHtml(a.room_name || 'Unknown Room')} (${UiHelpers.escapeHtml(a.building || '-')})</p>
=======
            <h1 class="text-headline-md font-headline-md text-primary">${UiHelpers.escapeHtml(a.asset_name)}</h1>
            <p class="text-on-surface-variant text-body-sm mt-1">${UiHelpers.escapeHtml(a.asset_type)} · Room ${UiHelpers.escapeHtml(a.room_name)}</p>
>>>>>>> Linh
          </div>
          ${UiHelpers.statusBadge(a.status)}
        </div>
        <div class="grid grid-cols-2 gap-4 mt-5 text-body-sm">
          <div><span class="text-on-surface-variant">Failure count:</span> <strong>${a.failure_count ?? 0}</strong></div>
          <div><span class="text-on-surface-variant">Last fault at:</span> ${UiHelpers.formatDate(a.last_fault_at)}</div>
        </div>

        <div class="mt-6">
          <label class="text-label-md font-label-md text-on-surface-variant">Update status</label>
          <div class="flex gap-2 mt-2">
            <select id="statusSelect" class="rounded-lg border border-outline-variant/50 px-3 py-2 text-body-sm">
              ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
            <button id="updateStatusBtn" class="bg-brand-blue text-white text-label-md font-label-md px-4 py-2 rounded-lg hover:opacity-90">Update</button>
          </div>
          <p id="updateError" class="hidden text-error text-body-sm mt-2"></p>
        </div>
      </div>

      <div class="mt-8 bg-white rounded-xl shadow-sm border border-outline-variant/20 p-6">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-headline-sm font-headline-sm text-on-surface">Asset Repair History</h2>
            <p class="text-label-md text-on-surface-variant mt-1">Review repair records and open details for each entry.</p>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead class="bg-surface-container-low border-b border-outline-variant/20">
              <tr class="text-label-md font-bold text-on-surface-variant uppercase tracking-wider text-center">
                <th class="px-4 py-3">Date</th>
                <th class="px-4 py-3">Fix / Action</th>
                <th class="px-4 py-3">Technician</th>
                <th class="px-4 py-3">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${currentHistoryItems.length === 0 ? `
                <tr><td colspan="4" class="text-center py-6 text-on-surface-variant">No repair history available.</td></tr>
              ` : currentHistoryItems.map((item, idx) => `
                <tr class="border-b border-outline-variant/10 hover:bg-surface-container-low/70 transition-colors">
                  <td class="px-4 py-4 text-center">${UiHelpers.formatDate(item.changed_at || item.assigned_at || item.completed_at)}</td>
                  <td class="px-4 py-4 text-center">${UiHelpers.escapeHtml(item.fix_description || item.notes || item.task_status || 'Update')}</td>
                  <td class="px-4 py-4 text-center">${UiHelpers.escapeHtml(item.technician_name || item.technician || 'N/A')}</td>
                  <td class="px-4 py-4 text-center">
                    <a href="./WorkOrderDetails.html?id=${encodeURIComponent(item.order_id ?? item.work_order_id ?? item.orderId ?? '')}" onclick="const href = this.getAttribute('href'); console.log('AssetDetails history link click:', href); event.preventDefault(); event.stopPropagation(); if (href) window.location.assign(href);" class="history-action-link inline-flex items-center justify-center rounded-full bg-surface-container-low border border-outline-variant/30 p-2 text-primary hover:bg-primary-fixed/10 transition-colors" title="Go to work order" aria-label="Open work order details">
                      <span class="material-symbols-outlined">visibility</span>
                    </a>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>`;

    document.getElementById('updateStatusBtn').addEventListener('click', async () => {
      const errorBox = document.getElementById('updateError');
      errorBox.classList.add('hidden');
      try {
        await Api.patch(`/assets/${assetId}`, { status: document.getElementById('statusSelect').value });
        load();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
      }
    });
  }

  function openHistoryModal(item) {
    const title = document.getElementById('historyModalTitle');
    const subtitle = document.getElementById('historyModalSubtitle');
    const body = document.getElementById('historyModalBody');

    if (title) title.textContent = item.task_status ? `${item.task_status} Details` : 'Repair History Details';
    if (subtitle) subtitle.textContent = item.technician_name ? `Performed by ${item.technician_name}` : 'Detailed repair record';
    if (body) {
      body.innerHTML = `
        <div class="space-y-4 text-body-sm text-on-surface">
          <div><span class="text-on-surface-variant">Date:</span> <strong>${UiHelpers.formatDate(item.changed_at || item.assigned_at || item.completed_at)}</strong></div>
          <div><span class="text-on-surface-variant">Status:</span> <strong>${UiHelpers.escapeHtml(item.task_status || item.status || 'N/A')}</strong></div>
          <div><span class="text-on-surface-variant">Technician:</span> <strong>${UiHelpers.escapeHtml(item.technician_name || item.technician || 'N/A')}</strong></div>
          <div><span class="text-on-surface-variant">Description:</span>
            <p class="mt-2 text-body-sm text-on-surface">${UiHelpers.escapeHtml(item.fix_description || item.notes || item.message || 'No details provided.')}</p>
          </div>
          ${item.parts_used ? `<div><span class="text-on-surface-variant">Parts used:</span> <strong>${UiHelpers.escapeHtml(item.parts_used)}</strong></div>` : ''}
          ${item.rejection_reason ? `<div><span class="text-on-surface-variant">Rejection reason:</span> <strong>${UiHelpers.escapeHtml(item.rejection_reason)}</strong></div>` : ''}
        </div>
      `;
    }
    document.getElementById('historyModal').classList.remove('hidden');
  }

  function closeHistoryModal() {
    document.getElementById('historyModal').classList.add('hidden');
  }

  async function load() {
    const asset = await Api.get(`/assets/${assetId}`);
    render(asset);
  }

  load().catch(err => { content.innerHTML = `<p class="text-error">${err.message}</p>`; });
</script>
</body>
</html>
